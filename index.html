   - космический процедурный фон

/* ---------------- КОНСТАНТЫ ---------------- */
var SUPER_CD    = 30;   // перезарядка суперудара, сек
var DROP_EVERY  = 45;   // каждые N сек падает оружие на землю
var BOSS_FIRST  = 40;   // первый босс на N-й секунде
var BOSS_EVERY  = 55;   // интервал между боссами
var MAX_WEAPONS = 6;    // слотов под оружие
var DROP_LIFE   = 75;   // сколько секунд ящик лежит на земле
var TAU = Math.PI * 2;

/* ---------------- УТИЛИТЫ ---------------- */
function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function hexA(hex,a){
  if(!hex || hex.charAt(0) !== '#') return hex;
  var h = hex.slice(1);
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function distToSeg(px,py,x1,y1,x2,y2){
  var dx = x2-x1, dy = y2-y1;
  var l2 = dx*dx + dy*dy || 1;
  var t = ((px-x1)*dx + (py-y1)*dy) / l2;
  t = clamp(t,0,1);
  var cx = x1 + t*dx, cy = y1 + t*dy;
  return Math.hypot(px-cx, py-cy);
}
function txt(s,x,y,size,color,align,weight){
  ctx.font = (weight||'bold') + ' ' + size + 'px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = color || '#fff';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------------- ХОЛСТ ---------------- */
var cvs = document.getElementById('game');
var ctx = cvs.getContext('2d');
var W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.floor(W*DPR);
  cvs.height = Math.floor(H*DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildBackground();
}

/* ---------------- ФОН ---------------- */
var stars = [], nebs = [];

function buildBackground(){
  stars = [];
  var count = Math.round((W*H) / 2400);
  for(var i=0;i<count;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      z: 0.2 + Math.random()*0.8,
      r: Math.random()*1.5 + 0.35,
      tw: Math.random()*TAU,
      hue: Math.random() < 0.14 ? 195 : (Math.random() < 0.09 ? 315 : 0)
    });
  }
  nebs = [];
  var cols = ['#5b2bd9','#1b6ee0','#0fb6a8','#a0299c','#2b3bd9','#0e7a9e'];
  for(var j=0;j<6;j++){
    nebs.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.min(W,H) * (0.28 + Math.random()*0.36),
      c: cols[j % cols.length],
      a: 0.10 + Math.random()*0.07,
      ph: Math.random()*TAU,
      sp: 0.12 + Math.random()*0.16
    });
  }
}

function drawBackground(){
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation = 'lighter';
  for(var i=0;i<nebs.length;i++){
    var n = nebs[i];
    var drift = Math.sin(state.time*n.sp + n.ph) * 26;
    var px = n.x + drift - cam.x*0.035;
    var py = n.y + Math.cos(state.time*n.sp*0.8 + n.ph) * 18 - cam.y*0.035;
    var g = ctx.createRadialGradient(px,py,0,px,py,n.r);
    g.addColorStop(0,    hexA(n.c, n.a*1.7));
    g.addColorStop(0.42, hexA(n.c, n.a*0.65));
    g.addColorStop(1,    hexA(n.c, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px,py,n.r,0,TAU);
    ctx.fill();
  }

  for(var s=0;s<stars.length;s++){
    var st = stars[s];
    var sx = ((st.x - cam.x*st.z*0.30) % W + W) % W;
    var sy = ((st.y - cam.y*st.z*0.30) % H + H) % H;
    var tw = 0.5 + 0.5*Math.sin(state.time*2.1 + st.tw);
    var rr = st.r * (0.75 + tw*0.45);
    var col;
    if(st.hue === 195) col = 'rgba(150,225,255,' + (0.35+tw*0.65) + ')';
    else if(st.hue === 315) col = 'rgba(255,170,235,' + (0.3+tw*0.6) + ')';
    else col = 'rgba(232,240,255,' + (0.28+tw*0.7) + ')';
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(sx,sy,rr,0,TAU);
    ctx.fill();
    if(rr > 1.25){
      ctx.strokeStyle = 'rgba(159,216,255,' + (0.10*tw) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx-rr*3, sy); ctx.lineTo(sx+rr*3, sy);
      ctx.moveTo(sx, sy-rr*3); ctx.lineTo(sx, sy+rr*3);
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  var vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.32,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}

/* ============================================================
   БОЙ
   ============================================================ */
function spawnParticles(x,y,color,n,spd){
  for(var i=0;i<n;i++){
    var a = Math.random()*TAU, s = rand(spd*0.25, spd);
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:rand(0.25,0.6),maxLife:0.6,r:rand(1.3,3.4),color:color});
  }
}
function addText(x,y,t,color,size){
  texts.push({x:x,y:y,txt:t,color:color||'#fff',size:size||15,life:0.85,maxLife:0.85,vy:-46});
}

function hitEnemy(e, dmg, opt){
  if(e.dead) return;
  opt = opt || {};
  var d = dmg;
  if(opt.crit) d *= 2;
  e.hp -= d;
  e.flash = 0.12;
  if(Math.random() < 0.55){
    addText(e.x + rand(-6,6), e.y - e.r - 8, Math.round(d), opt.crit?'#ffd76a':'#ffffff', opt.crit?18:14);
  }
  spawnParticles(e.x, e.y, opt.color || '#ff8a8a', 4, 130);
  if(opt.slow) e.slow = Math.max(e.slow || 0, opt.slow);
  if(opt.burn) e.burn = Math.max(e.burn || 0, opt.burn);
  if(opt.knock){
    var a = Math.atan2(e.y-player.y, e.x-player.x);
    var k = opt.knock / (e.isBoss?5:1);
    e.x += Math.cos(a)*k; e.y += Math.sin(a)*k;
  }
  if(e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  if(e.dead) return;
  e.dead = true;
  state.kills++;
  spawnParticles(e.x, e.y, e.color, e.isBoss?46:9, e.isBoss?320:170);

  for(var i=0;i<weapons.length;i++){
    if(weapons[i].def.lifesteal){ player.hp = Math.min(player.maxHp, player.hp + 1.6); break; }
  }

  if(e.isBoss){
    state.shake = 18;
    state.flash = Math.max(state.flash, 0.35);
    ebullets.length = 0;
    for(var j=0;j<7;j++) dropGem(e.x + rand(-50,50), e.y + rand(-50,50), 5);
    addText(e.x, e.y - 40, 'БОСС ПОВЕРЖЕН!', '#ffd166', 26);
    openWeaponChoice();
  } else {
    dropGem(e.x, e.y, e.xp || 1);
  }
}

function explode(x, y, r, dmg, color, knock){
  effects.push({type:'boom', x:x, y:y, r:r, life:0.34, maxLife:0.34, color:color});
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead) continue;
    if((e.x-x)*(e.x-x) + (e.y-y)*(e.y-y) < (r+e.r)*(r+e.r)){
      hitEnemy(e, dmg, {color:color, knock:knock||0});
    }
  }
  state.shake = Math.max(state.shake, 4);
}

function damagePlayer(amount){
  if(player.invuln > 0 || state.mode !== 'play') return;
  player.hp -= amount;
  player.invuln = 0.65;
  state.shake = Math.max(state.shake, 9);
  state.flash = Math.max(state.flash, 0.30);
  spawnParticles(player.x, player.y, '#ff5577', 12, 200);
  addText(player.x, player.y - 30, '-' + Math.round(amount), '#ff5577', 17);
  if(player.hp <= 0){
    player.hp = 0;
    state.mode = 'dead';
    state.shake = 22;
  }
}

function spawnPoint(){
  var a = Math.random()*TAU;
  var rad = Math.max(W,H)*0.62 + rand(30,150);
  return { x: player.x + Math.cos(a)*rad, y: player.y + Math.sin(a)*rad };
}

function spawnEnemy(){
  var p = spawnPoint();
  var t = state.time;
  var hpScale = 1 + t/85;
  var dmgScale = 1 + t/190;
  var roll = Math.random();
  var e;

  if(roll < 0.58){

function spawnBoss(){

  var p = spawnPoint();
  var tier = state.bossTier;
  var hp = 600 + tier*540;
  var b = {
    type:'boss', isBoss:true, x:p.x, y:p.y, r:46, hp:hp, maxHp:hp,

  };
  enemies.push(b);
  addText(player.x, player.y - 90, 'МИНИ-БОСС!', '#c084fc', 30);
  state.shake = 14;
  state.flash = Math.max(state.flash, 0.25);
}

/* ============================================================
   СТРЕЛЬБА
   ============================================================ */
function nearestEnemy(x, y, maxD){
  var best = null, bd = (maxD||1e9)*(maxD||1e9);
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead) continue;
    var d = (e.x-x)*(e.x-x) + (e.y-y)*(e.y-y);
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}

function addBullet(o){
  var b = {
    x:0, y:0, vx:0, vy:0, r:5, dmg:10, pierce:0, life:1.5, age:0,
    color:'#7ef9ff', homing:0, target:null, boom:0, burn:0, slow:0,
    knock:0, crit:0, type:'normal', jumps:0, hitSet:null, lifesteal:0, rev:false
  };
  for(var k in o) b[k] = o[k];
  bullets.push(b);
  return b;
}

function shootOne(a, d){
  addBullet({
    x: player.x + Math.cos(a)*(player.r+2),
    y: player.y + Math.sin(a)*(player.r+2),
    vx: Math.cos(a)*(d.speed||620),
    vy: Math.sin(a)*(d.speed||620),
    r: d.size||5, dmg: d.dmg,
    pierce: d.pierce||0, life: d.life||1.5, color: d.color,
    homing: d.homing||0, boom: d.boom||0, burn: d.burn||0,
    slow: d.slow||0, knock: d.knock||0, crit: d.crit||0
  });
}

function shootSpread(aim, d){
  var n = d.n || 1;
  var sp = d.spread || 0;
  for(var i=0;i<n;i++){
    var a = aim + (n>1 ? -sp/2 + sp*i/(n-1) : 0);
    shootOne(a, d);
  }
}

function castBeam(a, d){
  var len = 950;
  var x2 = player.x + Math.cos(a)*len;
  var y2 = player.y + Math.sin(a)*len;
  var wdt = d.w || 12;
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead) continue;
    if(distToSeg(e.x, e.y, player.x, player.y, x2, y2) < wdt/2 + e.r){
      hitEnemy(e, d.dmg, {color:d.color});
    }
  }
  effects.push({type:'beam', x1:player.x, y1:player.y, x2:x2, y2:y2,
    color:d.color, w:wdt, life:0.13, maxLife:0.13});
}

function castChain(first, d){
  if(!first) return;
  var cur = first;
  var hit = [];
  var pts = [{x:player.x, y:player.y}];
  var jumps = d.jumps || 5;
  for(var i=0;i<jumps && cur;i++){
    hit.push(cur);
    pts.push({x:cur.x, y:cur.y});
    hitEnemy(cur, d.dmg, {color:d.color});
    var best = null, bd = 300*300;
    for(var j=0;j<enemies.length;j++){
      var e = enemies[j];
      if(e.dead || hit.indexOf(e) !== -1) continue;
      var dd = (e.x-cur.x)*(e.x-cur.x) + (e.y-cur.y)*(e.y-cur.y);
      if(dd < bd){ bd = dd; best = e; }
    }
    cur = best;
  }
  effects.push({type:'chain', pts:pts, color:d.color, life:0.17, maxLife:0.17});
}

function castNova(d){
  effects.push({
    type:'ring', x:player.x, y:player.y, r:12, maxR:d.r, color:d.color,
    life:0.52, maxLife:0.52, dmg:d.dmg, hitSet:new Set(),
    grow:d.r/0.52, knock:d.knock||0
  });
}

function fireWeapon(w){
  var d = w.def;
  var tgt = nearestEnemy(player.x, player.y, 1000);
  var aim = tgt ? Math.atan2(tgt.y-player.y, tgt.x-player.x) : player.aim;
  var i, a;

  switch(d.kind){
    case 'shot':
      if(d.all){
        for(i=0;i<d.n;i++) shootOne(TAU*i/d.n + w.ang, d);
        w.ang += 0.4;
      } else {
        shootSpread(aim, d);
        if(d.back) shootSpread(aim + Math.PI, d);
      }
      break;

    case 'shotgun':
      shootSpread(aim, d);
      break;

    case 'flame':
      shootSpread(aim + rand(-0.12,0.12), d);
      break;

    case 'spiral':
      var cn = d.n || 2;
      for(i=0;i<cn;i++) shootOne(w.ang + TAU*i/cn, d);
      w.ang += 0.55;
      break;

    case 'beam':
      var dirs = d.dirs || 1;
      for(i=0;i<dirs;i++){
        a = aim + (dirs>1 ? -0.36 + 0.72*i/(dirs-1) : 0);
        castBeam(a, d);
      }
      break;

    case 'chain':
      castChain(tgt, d);
      break;

    case 'nova':
      castNova(d);
      break;

    case 'mine':
      var mn = d.n || 1;
      for(i=0;i<mn;i++){
        var ma = rand(0,TAU), mr = rand(8,52);
        mines.push({x:player.x+Math.cos(ma)*mr, y:player.y+Math.sin(ma)*mr,
          r:d.r, dmg:d.dmg, life:16, age:0, arm:0.3, color:d.color});
      }
      break;

    case 'boomerang':
      var bn = d.n || 1;
      for(i=0;i<bn;i++){
        a = aim + (bn>1 ? -0.42 + 0.84*i/(bn-1) : 0);
        addBullet({x:player.x, y:player.y,
          vx:Math.cos(a)*d.speed, vy:Math.sin(a)*d.speed,
          r:11, dmg:d.dmg, pierce:99, life:1.7, color:d.color,
          type:'ret', hitSet:new Set()});
      }
      break;

    case 'ricochet':
      addBullet({x:player.x, y:player.y,
        vx:Math.cos(aim)*d.speed, vy:Math.sin(aim)*d.speed,
        r:7, dmg:d.dmg, life:3.2, color:d.color,
        type:'rico', jumps:d.jumps, hitSet:new Set()});
      break;

    case 'vortex':
      var px = tgt ? tgt.x : player.x + rand(-140,140);
      var py = tgt ? tgt.y : player.y + rand(-140,140);
      effects.push({type:'vortex', x:px, y:py, r:d.r, dmg:d.dmg, color:d.color,
        life:d.dur, maxLife:d.dur, tick:0});
      break;
  }
}

function updateOrbit(w, dt){
  var d = w.def;
  var n = d.orbs || 2;
  if(!w.orbs){
    w.orbs = [];
    for(var i=0;i<n;i++) w.orbs.push({a: TAU*i/n});
    w.orbAng = 0;
  }
  w.orbAng += dt*1.9;
  for(var k=0;k<w.orbs.length;k++){
    var o = w.orbs[k];
    var a = w.orbAng + TAU*k/w.orbs.length;
    o.x = player.x + Math.cos(a)*d.rad;
    o.y = player.y + Math.sin(a)*d.rad;
    var rr = d.size || 14;
    for(var j=0;j<enemies.length;j++){
      var e = enemies[j];
      if(e.dead) continue;
      if((e.x-o.x)*(e.x-o.x) + (e.y-o.y)*(e.y-o.y) < (rr+e.r)*(rr+e.r)){
        var key = 'orb' + w.uid + '_' + k;
        if((state.time - (e.hits[key] || -99)) > 0.32){
          e.hits[key] = state.time;
          hitEnemy(e, d.dmg, {color:d.color, knock:8});
        }
      }
    }
  }
}

function updateTurret(w, dt){
  var d = w.def;
  var n = d.count || 2;
  if(!w.turrets){
    w.turrets = [];
    for(var i=0;i<n;i++) w.turrets.push({a: TAU*i/n, t: rand(0,0.3)});
    w.tAng = 0;
  }
  w.tAng += dt*1.4;
  for(var k=0;k<w.turrets.length;k++){
    var t = w.turrets[k];
    var a = w.tAng + TAU*k/w.turrets.length;
    t.x = player.x + Math.cos(a)*96;
    t.y = player.y + Math.sin(a)*96;
    t.t -= dt;
    if(t.t <= 0){
      t.t = d.cd;
      var tgt = nearestEnemy(t.x, t.y, 720);
      if(tgt){
        var ang = Math.atan2(tgt.y-t.y, tgt.x-t.x);
        addBullet({x:t.x, y:t.y, vx:Math.cos(ang)*720, vy:Math.sin(ang)*720,
          r:4, dmg:d.dmg, life:1.2, color:d.color});
      }
    }
  }
}

function updateAura(w, dt){
  var d = w.def;
  var r = d.rad || 110;
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead) continue;
    if((e.x-player.x)*(e.x-player.x) + (e.y-player.y)*(e.y-player.y) < (r+e.r)*(r+e.r)){
      var key = 'aura' + w.uid;
      if((state.time - (e.hits[key] || -99)) > (d.cd || 0.4)){
        e.hits[key] = state.time;
        hitEnemy(e, d.dmg, {color:d.color, slow:d.slow, burn:d.burn, lifesteal:d.lifesteal});
      }
    }
  }
}

/* ============================================================
   ДОБАВЛЕНИЕ ОРУЖИЯ
   ============================================================ */
function addWeapon(def){
  var same = null;
  for(var i=0;i<weapons.length;i++){
    if(weapons[i].def.name === def.name){ same = weapons[i]; break; }
  }
  if(same){
    same.lvl = (same.lvl || 1) + 1;
    same.def.dmg = Math.round(same.def.dmg * 1.28);
    addText(player.x, player.y - 46, same.def.name + ' УР.' + same.lvl, same.def.color, 19);
    spawnParticles(player.x, player.y, same.def.color, 22, 220);
    return;
  }
  if(weapons.length >= MAX_WEAPONS){
    var removed = weapons.shift();
    addText(player.x, player.y - 46, 'ВЫТЕСНЕНО: ' + removed.def.name, '#ff8a8a', 15);
  }
  var copy = {};
  for(var k in def) copy[k] = def[k];
  weapons.push({uid: ++uidCounter, def: copy, t: 0.25, ang: Math.random()*TAU, lvl: 1});

  addText(player.x, player.y - 46, def.name, def.color, 21);
  addText(player.x, player.y - 22, 'НОВОЕ ОРУЖИЕ', '#dfe8ff', 14);
  spawnParticles(player.x, player.y, def.color, 30, 260);
  state.flash = Math.max(state.flash, 0.22);
}

function spawnGroundDrop(){
  state.dropCount++;
  var owned = weapons.map(function(w){ return w.def.name; });
  var pool = WEAPONS.filter(function(d){ return owned.indexOf(d.name) === -1; });
  if(!pool.length) pool = WEAPONS;
  var def = pick(pool);

  var a = rand(0, TAU);
  var rad = rand(260, 430);
  drops.push({
    x: player.x + Math.cos(a)*rad,
    y: player.y + Math.sin(a)*rad,
    def: def,
    life: DROP_LIFE,
    age: 0
  });
  addText(player.x, player.y - 84, 'ОРУЖИЕ УПАЛО РЯДОМ', '#ffd166', 20);
}

var UPGRADES = [
  {n:'Урон +25%',        d:'Базовый бластер бьёт сильнее',   f:function(){ player.dmg *= 1.25; }},
  {n:'Скорострельность', d:'Бластер стреляет чаще',          f:function(){ player.fireCd = Math.max(0.09, player.fireCd*0.8); }},
  {n:'+1 пуля',          d:'Бластер выпускает лишнюю пулю',  f:function(){ player.mult++; }},
  {n:'Пробивание',       d:'Пули проходят сквозь врага',     f:function(){ player.pierce++; }},
  {n:'Лечение',          d:'+40 HP сразу',                   f:function(){ player.hp = Math.min(player.maxHp, player.hp+40); }},
  {n:'Магнит',           d:'Опыт притягивается издалека',    f:function(){ player.magnet += 70; }},
  {n:'Макс. HP',         d:'+25 к максимуму и лечение на 25',f:function(){ player.maxHp += 25; player.hp += 25; }},
  {n:'Скорость',         d:'Двигаешься на 12% быстрее',      f:function(){ player.speed *= 1.12; }},
  {n:'Ускорение пуль',   d:'Пули летят быстрее',             f:function(){ player.bulletSpeed *= 1.18; }}
];

function openLevelUp(){
  choiceMode = 'levelup';
  var pool = UPGRADES.slice();
  choices = [];
  for(var i=0;i<3 && pool.length;i++){
    var idx = Math.floor(Math.random()*pool.length);
    choices.push(pool.splice(idx,1)[0]);
  }
  state.mode = 'levelup';
}

function openWeaponChoice(){
  choiceMode = 'weapon';
  var owned = weapons.map(function(w){ return w.def.name; });
  var pool = WEAPONS.filter(function(d){ return owned.indexOf(d.name) === -1; });
  if(pool.length < 3) pool = WEAPONS.slice();
  choices = [];
  for(var i=0;i<3;i++){
    var idx = Math.floor(Math.random()*pool.length);
    var wd = pool[idx];
    choices.push({n: wd.name, d: wd.desc, icon: wd.icon, color: wd.color, weapon: wd});
    pool.splice(idx,1);
  }
  state.mode = 'weapon';
}

function chooseOption(i){
  if(!choices[i]) return;
  var c = choices[i];
  if(choiceMode === 'weapon' && c.weapon){
    addWeapon(c.weapon);
    player.hp = Math.min(player.maxHp, player.hp + 30);
  } else {
    c.f();
  }
  choices = [];
  choiceMode = '';
  state.mode = 'play';
}

   СУПЕРУДАР

function useSuper(){
  if(state.mode !== 'play' || state.superCd > 0) return;
  state.superCd = SUPER_CD;
  var dmg = 150 + player.dmg*6;
  effects.push({
    type:'ring', x:player.x, y:player.y, r:player.r, maxR: Math.max(W,H)*0.8,
    color:'#c58bff', life:0.75, maxLife:0.75, dmg:dmg, hitSet:new Set(),
    grow: Math.max(W,H)*1.1, knock:110, superRing:true
  });
  effects.push({type:'superStar', x:player.x, y:player.y, life:0.5, maxLife:0.5});
  state.shake = 22;
  state.flash = 0.85;
  state.hitstop = 0.13;
  spawnParticles(player.x, player.y, '#e0c3ff', 90, 520);
  addText(player.x, player.y - 60, 'СВЕРХНОВА!', '#e0c3ff', 32);
}

/* ============================================================
   ВВОД
   ============================================================ */
var keys = {};

window.addEventListener('keydown', function(e){
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) !== -1) e.preventDefault();
  var wasDown = keys[e.code];
  keys[e.code] = true;
  if(wasDown) return;
  onKey(e.code);
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ for(var k in keys) keys[k] = false; });

function onKey(code){
  if(state.mode === 'menu'){
    if(code === 'Enter' || code === 'Space'){ resetGame(); state.mode = 'play'; }
    return;
  }
  if(state.mode === 'dead'){
    if(code === 'KeyR' || code === 'Enter'){ resetGame(); state.mode = 'play'; }
    return;
  }
  if(code === 'Escape' || code === 'KeyP'){
    if(state.mode === 'play'){ state.mode = 'pause'; return; }
    if(state.mode === 'pause'){ state.mode = 'play'; return; }
  }
  if(state.mode === 'pause'){
    if(code === 'KeyR'){ resetGame(); state.mode = 'play'; }
    return;
  }
  if(state.mode === 'levelup' || state.mode === 'weapon'){
    if(code === 'Digit1' || code === 'Numpad1'){ chooseOption(0); return; }
    if(code === 'Digit2' || code === 'Numpad2'){ chooseOption(1); return; }
    if(code === 'Digit3' || code === 'Numpad3'){ chooseOption(2); return; }
    return;
  }
  if(state.mode === 'play' && code === 'Space'){ useSuper(); }
}

/* ============================================================
   ОБНОВЛЕНИЕ МИРА
   ============================================================ */
function updateWorld(dt){
  /* игрок */
  var mx = 0, my = 0;
  if(keys['KeyW'] || keys['ArrowUp'])    my -= 1;
  if(keys['KeyS'] || keys['ArrowDown'])  my += 1;
  if(keys['KeyA'] || keys['ArrowLeft'])  mx -= 1;
  if(keys['KeyD'] || keys['ArrowRight']) mx += 1;
  if(mx || my){
    var l = Math.hypot(mx,my);
    mx /= l; my /= l;
    player.x += mx*player.speed*dt;
    player.y += my*player.speed*dt;
  }
  cam.x += (player.x - cam.x) * Math.min(1, dt*9);
  cam.y += (player.y - cam.y) * Math.min(1, dt*9);

  if(player.invuln > 0) player.invuln -= dt;

  /* прицел и базовый бластер */
  var aimTgt = nearestEnemy(player.x, player.y, 1200);
  if(aimTgt) player.aim = Math.atan2(aimTgt.y - player.y, aimTgt.x - player.x);

  player.fireTimer -= dt;
  if(player.fireTimer <= 0 && aimTgt){
    player.fireTimer = player.fireCd;
    var n = player.mult, sp = 0.16, i, a;
    for(i=0;i<n;i++){
      a = player.aim + (n>1 ? -sp/2 + sp*i/(n-1) : 0);
      addBullet({
        x: player.x + Math.cos(a)*(player.r+2),
        y: player.y + Math.sin(a)*(player.r+2),
        vx: Math.cos(a)*player.bulletSpeed,
        vy: Math.sin(a)*player.bulletSpeed,
        r: 5, dmg: player.dmg, pierce: player.pierce,
        life: 1.4, color: '#8be9ff'
      });
    }
  }

  /* оружие */
  for(i=0;i<weapons.length;i++){
    var w = weapons[i];
    var d = w.def;
    if(d.kind === 'orbit'){ updateOrbit(w, dt); continue; }
    if(d.kind === 'turret'){ updateTurret(w, dt); continue; }
    if(d.kind === 'aura'){ updateAura(w, dt); continue; }
    w.t -= dt;
    if(w.t <= 0){ fireWeapon(w); w.t = d.cd; }
  }

  /* суперудар */
  if(state.superCd > 0) state.superCd = Math.max(0, state.superCd - dt);

  /* спавн врагов */
  state.spawnTimer -= dt;
  if(state.spawnTimer <= 0){
    var rate = Math.max(0.16, 0.78 - state.time*0.0055);
    state.spawnTimer = rate;
    spawnEnemy();
    if(state.time > 40 && Math.random() < 0.35) spawnEnemy();
    if(state.time > 95 && Math.random() < 0.30) spawnEnemy();
  }

  /* боссы */
  state.bossTimer -= dt;
  if(state.bossTimer <= 0){
    spawnBoss();
    state.bossTimer = BOSS_EVERY;
  }

  /* падение оружия на землю */
  state.dropTimer += dt;
  if(state.dropTimer >= DROP_EVERY){
    state.dropTimer = 0;
    spawnGroundDrop();
  }

  updateEnemies(dt);
  updateBullets(dt);
  updateEBullets(dt);
  updateEffects(dt);
  updateMines(dt);
  updateGems(dt);
  updateDrops(dt);
  updateParticles(dt);

  enemies  = enemies.filter(function(e){ return !e.dead; });
  bullets  = bullets.filter(function(b){ return !b.dead; });
  ebullets = ebullets.filter(function(b){ return !b.dead; });
}

function updateEnemies(dt){
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead) continue;
    if(e.flash > 0) e.flash -= dt;

    if(e.burn > 0){
      e.burn -= dt;
      e.hp -= 9*dt;
      if(Math.random() < 0.25){
        spawnParticles(e.x + rand(-8,8), e.y + rand(-8,8), '#ff8a3d', 1, 60);
      }
      if(e.hp <= 0){ killEnemy(e); continue; }
    }
    var slowMul = 1;
    if(e.slow > 0){ e.slow -= dt; slowMul = 0.55; }

    var a = Math.atan2(player.y - e.y, player.x - e.x);
    var spd = e.speed * slowMul;

    if(e.isBoss){
      e.shootT -= dt;
      e.dashT -= dt;
      if(e.dashT <= 0){
        e.dashT = 3.6;
        e.dashV = 1;
        spawnParticles(e.x, e.y, '#c084fc', 20, 220);
      }
      var dashMul = e.dashV > 0 ? 3.1 : 1;
      if(e.dashV > 0){
        e.dashV -= dt*0.85;
        if(e.dashV <= 0) e.dashV = 0;
      }
      e.x += Math.cos(a)*spd*dashMul*dt;
      e.y += Math.sin(a)*spd*dashMul*dt;

      if(e.shootT <= 0){
        e.shootT = 2.4;
        var cnt = 8 + state.bossTier;
        var off = Math.random()*TAU;
        for(var j=0;j<cnt;j++){
          var ang = off + TAU*j/cnt;
          ebullets.push({x:e.x, y:e.y, vx:Math.cos(ang)*230, vy:Math.sin(ang)*230,
            r:7, dmg:e.dmg*0.5, life:3.4, color:'#c084fc'});
        }
      }
    } else {
      e.x += Math.cos(a)*spd*dt;
      e.y += Math.sin(a)*spd*dt;
      e.rot += dt*(e.type === 'runner' ? 6 : 1.5);
    }

    var rr = e.r + player.r;
    if((e.x-player.x)*(e.x-player.x) + (e.y-player.y)*(e.y-player.y) < rr*rr){
      damagePlayer(e.dmg);
      if(!e.isBoss){
        var push = Math.atan2(e.y-player.y, e.x-player.x);
        e.x += Math.cos(push)*14;
        e.y += Math.sin(push)*14;
      }
    }
  }
}

function updateBullets(dt){
  for(var i=0;i<bullets.length;i++){
    var b = bullets[i];
    if(b.dead) continue;
    b.age += dt;

    if(b.homing){
      if(!b.target || b.target.dead) b.target = nearestEnemy(b.x, b.y, 700);
      if(b.target){
        var sp = Math.hypot(b.vx, b.vy);
        var ca = Math.atan2(b.vy, b.vx);
        var na = Math.atan2(b.target.y-b.y, b.target.x-b.x);
        var da = ((na - ca + Math.PI*3) % TAU) - Math.PI;
        var turn = b.homing*dt;
        var fin = ca + clamp(da, -turn, turn);
        b.vx = Math.cos(fin)*sp;
        b.vy = Math.sin(fin)*sp;
      }
    }

    if(b.type === 'ret' && !b.rev && b.age > b.life*0.45){
      b.rev = true;
      b.vx *= -1; b.vy *= -1;
      b.hitSet = new Set();
    }

    b.x += b.vx*dt;
    b.y += b.vy*dt;

    if(b.age > b.life || Math.abs(b.x-player.x) > 2200 || Math.abs(b.y-player.y) > 2200){
      if(b.boom) explode(b.x, b.y, b.boom, b.dmg*0.7, b.color);
      b.dead = true;
      continue;
    }

    for(var j=0;j<enemies.length;j++){
      var e = enemies[j];
      if(e.dead) continue;
      if(b.hitSet && b.hitSet.has(e)) continue;
      var rr = b.r + e.r;
      if((e.x-b.x)*(e.x-b.x) + (e.y-b.y)*(e.y-b.y) < rr*rr){
        if(b.hitSet) b.hitSet.add(e);

        if(b.boom){
          explode(b.x, b.y, b.boom, b.dmg, b.color, b.knock);
          b.dead = true;
          break;
        }

        hitEnemy(e, b.dmg, {color:b.color, burn:b.burn, slow:b.slow, knock:b.knock, crit:b.crit});

        if(b.type === 'rico'){
          b.jumps--;
          if(b.jumps <= 0){ b.dead = true; break; }
          var best = null, bd = 1e9;
          for(var k=0;k<enemies.length;k++){
            var o = enemies[k];
            if(o.dead || b.hitSet.has(o)) continue;
            var dd = (o.x-b.x)*(o.x-b.x) + (o.y-b.y)*(o.y-b.y);
            if(dd < bd && dd < 420*420){ bd = dd; best = o; }
          }
          if(!best){ b.dead = true; break; }
          var s2 = Math.hypot(b.vx, b.vy);
          var ang2 = Math.atan2(best.y-b.y, best.x-b.x);
          b.vx = Math.cos(ang2)*s2;
          b.vy = Math.sin(ang2)*s2;
        } else if(b.pierce > 0){
          b.pierce--;
        } else if(b.type !== 'ret'){
          b.dead = true;
          break;
        }
      }
    }
  }
}

function updateEBullets(dt){
  for(var i=0;i<ebullets.length;i++){
    var b = ebullets[i];
    if(b.dead) continue;
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    b.life -= dt;
    if(b.life <= 0){ b.dead = true; continue; }
    var rr = b.r + player.r;
    if((b.x-player.x)*(b.x-player.x) + (b.y-player.y)*(b.y-player.y) < rr*rr){
      damagePlayer(b.dmg);
      b.dead = true;
    }
  }
}

function updateEffects(dt){
  for(var i=0;i<effects.length;i++){
    var fx = effects[i];
    if(fx.life === undefined) continue;
    fx.life -= dt;

    if(fx.type === 'ring'){
      fx.r = Math.min(fx.maxR, fx.r + fx.grow*dt);
      for(var j=0;j<enemies.length;j++){
        var e = enemies[j];
        if(e.dead || fx.hitSet.has(e)) continue;
        if((e.x-fx.x)*(e.x-fx.x) + (e.y-fx.y)*(e.y-fx.y) < (fx.r+e.r)*(fx.r+e.r)){
          fx.hitSet.add(e);
          hitEnemy(e, fx.dmg, {color:fx.color, knock:fx.knock||0});
        }
      }
    }

    if(fx.type === 'vortex'){
      fx.tick -= dt;
      for(var m=0;m<enemies.length;m++){
        var en = enemies[m];
        if(en.dead || en.isBoss) continue;
        var dx = fx.x - en.x, dy = fx.y - en.y;
        var d = Math.hypot(dx,dy) || 1;
        if(d < fx.r){
          en.x += (dx/d) * 190 * dt;
          en.y += (dy/d) * 190 * dt;
          if(fx.tick <= 0) hitEnemy(en, fx.dmg, {color:fx.color});
        }
      }
      if(fx.tick <= 0) fx.tick = 0.28;
    }
  }
  effects = effects.filter(function(fx){ return fx.life > 0; });
}

function updateMines(dt){
  for(var i=0;i<mines.length;i++){
    var m = mines[i];
    if(m.dead) continue;
    m.age += dt;
    m.life -= dt;
    var boom = false;
    if(m.age > m.arm){
      for(var j=0;j<enemies.length;j++){
        var e = enemies[j];
        if(e.dead) continue;
        var rr = e.r + 16;
        if((e.x-m.x)*(e.x-m.x) + (e.y-m.y)*(e.y-m.y) < rr*rr){ boom = true; break; }
      }
    }
    if(m.life <= 0) boom = true;
    if(boom){
      explode(m.x, m.y, m.r, m.dmg, m.color, 40);
      m.dead = true;
    }
  }
  mines = mines.filter(function(m){ return !m.dead; });
}

function dropGem(x, y, val){
  gems.push({x:x, y:y, vx:rand(-40,40), vy:rand(-40,40), val:val||1, life:30, r:6});
}
function updateGems(dt){
  for(var i=0;i<gems.length;i++){
    var g = gems[i];
    if(g.dead) continue;
    g.life -= dt;
    if(g.life <= 0){ g.dead = true; continue; }
    var dx = player.x - g.x, dy = player.y - g.y;
    var d = Math.hypot(dx,dy) || 1;
    if(d < player.magnet){
      var pull = 300 + (player.magnet - d)*5;
      g.vx += (dx/d)*pull*dt;
      g.vy += (dy/d)*pull*dt;
    }
    g.vx *= 0.94; g.vy *= 0.94;
    g.x += g.vx*dt; g.y += g.vy*dt;

    var rr = player.r + 12;
    if(d < rr){
      g.dead = true;
      player.xp += g.val;
      spawnParticles(g.x, g.y, '#7ef9ff', 4, 110);
      while(player.xp >= player.xpNeed){
        player.xp -= player.xpNeed;
        player.level++;
        player.xpNeed = Math.round(player.xpNeed * 1.32 + 3);
        openLevelUp();
      }
    }
  }
  gems = gems.filter(function(g){ return !g.dead; });
}

function updateDrops(dt){
  for(var i=0;i<drops.length;i++){
    var d = drops[i];
    if(d.dead) continue;
    d.age += dt;
    d.life -= dt;
    if(d.life <= 0){ d.dead = true; continue; }
    var rr = player.r + 26;
    if((d.x-player.x)*(d.x-player.x) + (d.y-player.y)*(d.y-player.y) < rr*rr){
      addWeapon(d.def);
      d.dead = true;
    }
  }
  drops = drops.filter(function(d){ return !d.dead; });
}

function updateParticles(dt){
  for(var i=0;i<particles.length;i++){
    var p = particles[i];
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= dt;
  }
  particles = particles.filter(function(p){ return p.life > 0; });

  for(var j=0;j<texts.length;j++){
    var t = texts[j];
    t.y += t.vy*dt;
    t.vy *= 0.94;
    t.life -= dt;
  }
  texts = texts.filter(function(t){ return t.life > 0; });
}

/* ============================================================
   РИСОВАНИЕ
   ============================================================ */
function draw(){
  drawBackground();

  ctx.save();
  var shx = 0, shy = 0;
  if(state.shake > 0.4){
    shx = rand(-1,1)*state.shake;
    shy = rand(-1,1)*state.shake;
  }
  ctx.translate(W/2 - cam.x + shx, H/2 - cam.y + shy);

  drawGemsAndDrops();
  drawMines();
  drawEnemies();
  drawEBullets();
  drawBullets();
  drawEffects();
  if(state.mode !== 'dead') drawPlayer();
  drawParticles();
  drawTexts();

  ctx.restore();

  if(state.flash > 0){
    ctx.fillStyle = 'rgba(200,180,255,' + (state.flash*0.55) + ')';
    ctx.fillRect(0,0,W,H);
  }

  drawDropArrows();
  drawHUD();
  drawOverlay();
}

function drawPlayer(){
  var p = player;
  var pulse = 1 + Math.sin(state.time*6)*0.05;
  var i, w, k;

  for(i=0;i<weapons.length;i++){
    w = weapons[i];
    if(w.def.kind === 'orbit' && w.orbs){
      for(k=0;k<w.orbs.length;k++){
        var o = w.orbs[k];
        ctx.globalCompositeOperation = 'lighter';
        var g = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,w.def.size*2.2);
        g.addColorStop(0, hexA(w.def.color,0.85));
        g.addColorStop(1, hexA(w.def.color,0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(o.x,o.y,w.def.size*2.2,0,TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = w.def.color;
        ctx.beginPath(); ctx.arc(o.x,o.y,w.def.size,0,TAU); ctx.fill();
        ctx.fillStyle = '#0a0d18';
        ctx.beginPath(); ctx.arc(o.x,o.y,w.def.size*0.45,0,TAU); ctx.fill();
      }
    }
    if(w.def.kind === 'turret' && w.turrets){
      for(k=0;k<w.turrets.length;k++){
        var t = w.turrets[k];
        ctx.fillStyle = w.def.color;
        ctx.beginPath(); ctx.arc(t.x,t.y,7,0,TAU); ctx.fill();
        ctx.fillStyle = '#0a0d18';
        ctx.beginPath(); ctx.arc(t.x,t.y,3,0,TAU); ctx.fill();
      }
    }
    if(w.def.kind === 'aura'){
      var ar = w.def.rad;
      ctx.globalCompositeOperation = 'lighter';
      var ag = ctx.createRadialGradient(p.x,p.y,ar*0.35,p.x,p.y,ar);
      ag.addColorStop(0, hexA(w.def.color,0.02));
      ag.addColorStop(0.7, hexA(w.def.color,0.10));
      ag.addColorStop(1, hexA(w.def.color,0.22));
      ctx.fillStyle = ag;
      ctx.beginPath(); ctx.arc(p.x,p.y,ar,0,TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = hexA(w.def.color,0.35);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,ar,0,TAU); ctx.stroke();
    }
  }

  if(state.superCd <= 0 && state.mode === 'play'){
    var pr = p.r + 14 + Math.sin(state.time*5)*4;
    ctx.strokeStyle = 'rgba(197,139,255,' + (0.45 + Math.sin(state.time*5)*0.25) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, TAU); ctx.stroke();
  }

  ctx.globalCompositeOperation = 'lighter';
  var gg = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,52*pulse);
  gg.addColorStop(0,'rgba(140,225,255,0.55)');
  gg.addColorStop(1,'rgba(140,225,255,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(p.x,p.y,52*pulse,0,TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  var blink = p.invuln > 0 && Math.floor(p.invuln*20) % 2 === 0;
  ctx.fillStyle = blink ? '#ff9fb6' : '#eaf6ff';
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r*pulse,0,TAU); ctx.fill();
  ctx.fillStyle = '#4fc3f7';
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.62,0,TAU); ctx.fill();
  ctx.fillStyle = '#0a0d18';
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.3,0,TAU); ctx.fill();

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.aim);
  ctx.fillStyle = '#cfe9ff';
  ctx.fillRect(p.r*0.5, -3.5, p.r*0.95, 7);
  ctx.restore();
}

function drawEnemies(){
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead) continue;

    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*2.1);
    g.addColorStop(0, hexA(e.color,0.42));
    g.addColorStop(1, hexA(e.color,0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r*2.1,0,TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;

    if(e.type === 'runner'){
      ctx.save();
      ctx.translate(e.x,e.y);
      ctx.rotate(Math.atan2(player.y-e.y, player.x-e.x));
      ctx.beginPath();
      ctx.moveTo(e.r,0);
      ctx.lineTo(-e.r*0.8, e.r*0.78);
      ctx.lineTo(-e.r*0.8, -e.r*0.78);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if(e.type === 'brute'){
      ctx.save();
      ctx.translate(e.x,e.y);
      ctx.rotate(e.rot*0.2);
      ctx.beginPath();
      for(var s=0;s<6;s++){
        var a6 = TAU*s/6;
        var px6 = Math.cos(a6)*e.r, py6 = Math.sin(a6)*e.r;
        if(s===0) ctx.moveTo(px6,py6); else ctx.lineTo(px6,py6);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if(e.isBoss){
      ctx.save();
      ctx.translate(e.x,e.y);
      ctx.rotate(state.time*0.6);
      ctx.beginPath();
      for(var s2=0;s2<8;s2++){
        var a8 = TAU*s2/8;
        var rr8 = e.r * (s2%2 ? 0.72 : 1);
        var px8 = Math.cos(a8)*rr8, py8 = Math.sin(a8)*rr8;
        if(s2===0) ctx.moveTo(px8,py8); else ctx.lineTo(px8,py8);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = hexA('#ffd6ff', 0.8);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r*1.24 + Math.sin(state.time*4)*4, 0, TAU);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#0a0d18';
      ctx.beginPath(); ctx.arc(e.x-e.r*0.26, e.y-e.r*0.16, e.r*0.17, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x+e.r*0.26, e.y-e.r*0.16, e.r*0.17, 0, TAU); ctx.fill();
    }

    if(!e.isBoss && e.hp < e.maxHp){
      var pct = clamp(e.hp/e.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x-e.r, e.y-e.r-10, e.r*2, 4);
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x-e.r, e.y-e.r-10, e.r*2*pct, 4);
    }
  }
}

function drawBullets(){
  ctx.globalCompositeOperation = 'lighter';
  for(var i=0;i<bullets.length;i++){
    var b = bullets[i];
    if(b.dead) continue;
    var g = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*3);
    g.addColorStop(0, hexA(b.color,0.95));
    g.addColorStop(1, hexA(b.color,0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*3,0,TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*0.7,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawEBullets(){
  ctx.globalCompositeOperation = 'lighter';
  for(var i=0;i<ebullets.length;i++){
    var b = ebullets[i];
    if(b.dead) continue;
    var g = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*3);
    g.addColorStop(0, hexA(b.color,0.9));
    g.addColorStop(1, hexA(b.color,0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*3,0,TAU); ctx.fill();
    ctx.fillStyle = '#ffe6ff';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*0.55,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawEffects(){
  for(var i=0;i<effects.length;i++){
    var fx = effects[i];
    var t = fx.life / (fx.maxLife || 1);

    if(fx.type === 'ring'){
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hexA(fx.color, t*0.95);
      ctx.lineWidth = fx.superRing ? 14*t + 4 : 6*t + 2;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r, 0, TAU); ctx.stroke();
      ctx.strokeStyle = hexA('#ffffff', t*0.5);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r*0.94, 0, TAU); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    else if(fx.type === 'boom'){
      ctx.globalCompositeOperation = 'lighter';
      var g = ctx.createRadialGradient(fx.x,fx.y,0,fx.x,fx.y,fx.r);
      g.addColorStop(0, hexA(fx.color, 0.55*t));
      g.addColorStop(0.6, hexA(fx.color, 0.22*t));
      g.addColorStop(1, hexA(fx.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r,0,TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    else if(fx.type === 'beam'){
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hexA(fx.color, t*0.9);
      ctx.lineWidth = fx.w * t;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(fx.x1,fx.y1); ctx.lineTo(fx.x2,fx.y2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (t*0.85) + ')';
      ctx.lineWidth = Math.max(1, fx.w*t*0.28);
      ctx.beginPath(); ctx.moveTo(fx.x1,fx.y1); ctx.lineTo(fx.x2,fx.y2); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    else if(fx.type === 'chain'){
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hexA(fx.color, t);
      ctx.lineWidth = 4*t + 1;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for(var p=0;p<fx.pts.length-1;p++){
        var a1 = fx.pts[p], a2 = fx.pts[p+1];
        ctx.moveTo(a1.x, a1.y);
        var segs = 4;
        for(var s=1;s<=segs;s++){
          var tt = s/segs;
          var jx = a1.x + (a2.x-a1.x)*tt + (s<segs ? rand(-9,9) : 0);
          var jy = a1.y + (a2.y-a1.y)*tt + (s<segs ? rand(-9,9) : 0);
          ctx.lineTo(jx, jy);
        }
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    else if(fx.type === 'vortex'){
      ctx.globalCompositeOperation = 'lighter';
      var vg = ctx.createRadialGradient(fx.x,fx.y,0,fx.x,fx.y,fx.r);
      vg.addColorStop(0, hexA(fx.color, 0.5*t));
      vg.addColorStop(0.5, hexA(fx.color, 0.16*t));
      vg.addColorStop(1, hexA(fx.color, 0));
      ctx.fillStyle = vg;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r,0,TAU); ctx.fill();
      ctx.strokeStyle = hexA(fx.color, 0.7*t);
      ctx.lineWidth = 2;
      for(var r2=0;r2<3;r2++){
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, fx.r*(0.35+r2*0.22) + Math.sin(state.time*8+r2)*6,
          state.time*3 + r2, state.time*3 + r2 + 2.2);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    else if(fx.type === 'superStar'){
      ctx.globalCompositeOperation = 'lighter';
      var sg = ctx.createRadialGradient(fx.x,fx.y,0,fx.x,fx.y,220*(1-t+0.4));
      sg.addColorStop(0, 'rgba(255,255,255,' + (t*0.9) + ')');
      sg.addColorStop(0.4, 'rgba(197,139,255,' + (t*0.4) + ')');
      sg.addColorStop(1, 'rgba(197,139,255,0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,220*(1-t+0.4),0,TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
}

function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';
  for(var i=0;i<particles.length;i++){
    var p = particles[i];
    var a = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = hexA(p.color, a);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*a, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawTexts(){
  for(var i=0;i<texts.length;i++){
    var t = texts[i];
    var a = clamp(t.life / t.maxLife, 0, 1);
    ctx.globalAlpha = a;
    txt(t.txt, t.x, t.y, t.size, t.color, 'center');
    ctx.globalAlpha = 1;
  }
}

function drawMines(){
  for(var i=0;i<mines.length;i++){
    var m = mines[i];
    var pulse = 0.5 + 0.5*Math.sin(state.time*10);
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,26);
    g.addColorStop(0, hexA(m.color, 0.5*pulse));
    g.addColorStop(1, hexA(m.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(m.x,m.y,26,0,TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#151b2a';
    ctx.beginPath(); ctx.arc(m.x,m.y,10,0,TAU); ctx.fill();
    ctx.strokeStyle = m.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(m.x,m.y,10,0,TAU); ctx.stroke();
    ctx.fillStyle = hexA(m.color, 0.4 + pulse*0.6);
    ctx.beginPath(); ctx.arc(m.x,m.y,3.5,0,TAU); ctx.fill();
  }
}

function drawGemsAndDrops(){
  /* кристаллы опыта */
  for(var i=0;i<gems.length;i++){
    var g = gems[i];
    var a = g.life < 4 ? (0.4 + 0.6*Math.abs(Math.sin(state.time*8))) : 1;
    ctx.globalCompositeOperation = 'lighter';
    var gg = ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,16);
    gg.addColorStop(0, 'rgba(126,249,255,' + (0.5*a) + ')');
    gg.addColorStop(1, 'rgba(126,249,255,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(g.x,g.y,16,0,TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.translate(g.x,g.y);
    ctx.rotate(state.time*2);
    ctx.fillStyle = 'rgba(210,250,255,' + a + ')';
    ctx.beginPath();
    ctx.moveTo(0,-5); ctx.lineTo(4,0); ctx.lineTo(0,5); ctx.lineTo(-4,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* оружие на земле */
  for(var k=0;k<drops.length;k++){
    var d = drops[k];
    var c = d.def.color;
    var pulse = 0.55 + 0.45*Math.sin(state.time*4 + d.age);

    /* световой столб */
    ctx.globalCompositeOperation = 'lighter';
    var dg = ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,100);
    dg.addColorStop(0, hexA(c, 0.34*pulse));
    dg.addColorStop(0.5, hexA(c, 0.12*pulse));
    dg.addColorStop(1, hexA(c, 0));
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.arc(d.x,d.y,100,0,TAU); ctx.fill();

    var beamG = ctx.createLinearGradient(d.x, d.y-260, d.x, d.y);
    beamG.addColorStop(0, hexA(c, 0));
    beamG.addColorStop(1, hexA(c, 0.16*pulse));
    ctx.fillStyle = beamG;
    ctx.fillRect(d.x-9, d.y-260, 18, 260);
    ctx.globalCompositeOperation = 'source-over';

    /* кольцо на земле */
    ctx.strokeStyle = hexA(c, 0.55*pulse);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(d.x, d.y, 26 + pulse*5, 0, TAU); ctx.stroke();

    /* ящик */
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(Math.sin(state.time*1.6 + k)*0.14);
    ctx.fillStyle = 'rgba(12,18,30,0.95)';
    rrect(-15,-15,30,30,7); ctx.fill();
    ctx.strokeStyle = c;
    ctx.lineWidth = 2.5;
    rrect(-15,-15,30,30,7); ctx.stroke();
    ctx.restore();

    txt(d.def.icon, d.x, d.y+1, 17, '#ffffff', 'center');
    txt(d.def.name, d.x, d.y-46, 14, c, 'center');
    if(d.life < 12){
      txt(Math.ceil(d.life) + 'с', d.x, d.y+34, 11, 'rgba(255,120,120,0.9)', 'center');
    }
  }
}

/* стрелки-указатели на упавшее оружие за экраном */
function drawDropArrows(){
  if(state.mode !== 'play' && state.mode !== 'pause') return;
  for(var i=0;i<drops.length;i++){
    var d = drops[i];
    var sx = d.x - cam.x + W/2;
    var sy = d.y - cam.y + H/2;
    if(sx > 40 && sx < W-40 && sy > 40 && sy < H-40) continue;
    var a = Math.atan2(sy - H/2, sx - W/2);
    var rad = Math.min(W,H)/2 - 54;
    var px = W/2 + Math.cos(a)*rad;
    var py = H/2 + Math.sin(a)*rad;
    var pulse = 0.55 + 0.45*Math.sin(state.time*5);

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(a);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = hexA(d.def.color, 0.85*pulse);
    ctx.beginPath();
    ctx.moveTo(14,0); ctx.lineTo(-8,9); ctx.lineTo(-8,-9);
    ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    txt(d.def.icon, px + Math.cos(a)*-22, py + Math.sin(a)*-22, 15, '#fff', 'center');
  }
}

/* ============================================================
   HUD
   ============================================================ */
function drawHUD(){
  if(state.mode === 'menu') return;

  /* HP */
  var bw = 260, bh = 16, bx = 24, by = 24;
  ctx.fillStyle = 'rgba(10,14,24,0.75)';
  rrect(bx-2, by-2, bw+4, bh+4, 9); ctx.fill();
  var hpPct = clamp(player.hp/player.maxHp, 0, 1);
  var grad = ctx.createLinearGradient(bx,0,bx+bw,0);
  grad.addColorStop(0,'#4ff0a8');
  grad.addColorStop(0.6,'#7ef9ff');
  grad.addColorStop(1,'#4fc3f7');
  ctx.fillStyle = hpPct > 0.35 ? grad : '#ff5577';
  rrect(bx, by, bw*hpPct, bh, 7); ctx.fill();
  txt(Math.ceil(player.hp) + ' / ' + player.maxHp, bx + bw/2, by + bh/2 + 1, 12, '#04121a', 'center');

  /* XP */
  var xb = bx, xy = by + bh + 8, xw = bw, xh = 7;
  ctx.fillStyle = 'rgba(10,14,24,0.75)';
  rrect(xb, xy, xw, xh, 4); ctx.fill();
  ctx.fillStyle = '#a06bff';
  rrect(xb, xy, xw*clamp(player.xp/player.xpNeed,0,1), xh, 4); ctx.fill();
  txt('УР. ' + player.level, bx + bw + 14, by + 12, 15, '#e8eefc', 'left');

  /* таймер / убийства */
  txt(fmtTime(state.time), W/2, 34, 30, '#eaf6ff', 'center');
  txt('убито: ' + state.kills, W/2, 62, 14, 'rgba(200,215,240,0.75)', 'center');

  /* полоса босса */
  var boss = null;
  for(var i=0;i<enemies.length;i++){ if(enemies[i].isBoss && !enemies[i].dead){ boss = enemies[i]; break; } }
  if(boss){
    var bwid = Math.min(560, W-120);
    var bxx = W/2 - bwid/2, byy = 84;
    ctx.fillStyle = 'rgba(10,14,24,0.8)';
    rrect(bxx-3, byy-3, bwid+6, 20, 9); ctx.fill();
    ctx.fillStyle = '#c084fc';
    rrect(bxx, byy, bwid*clamp(boss.hp/boss.maxHp,0,1), 14, 7); ctx.fill();
    txt('МИНИ-БОСС', W/2, byy + 7, 12, '#1a0b26', 'center');
  }

  /* оружие — список слева внизу */
  var wy = H - 30;
  for(var k=0;k<weapons.length;k++){
    var w = weapons[k];
    var iconSize = 15;
    txt(w.def.icon, 26 + k*44, wy, iconSize, '#fff', 'left');
    if(w.lvl > 1){
      txt('×' + w.lvl, 44 + k*44, wy + 12, 10, w.def.color, 'left');
    }
    ctx.strokeStyle = hexA(w.def.color, 0.55);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(33 + k*44, wy, 17, 0, TAU); ctx.stroke();
  }
  if(weapons.length){
    txt('ОРУЖИЕ (' + weapons.length + '/' + MAX_WEAPONS + ')', 26, wy - 28, 11, 'rgba(200,215,240,0.6)', 'left');
  }

  /* суперудар */
  var sw = 220, sh = 12, sx2 = W - sw - 26, sy2 = H - 34;
  ctx.fillStyle = 'rgba(10,14,24,0.8)';
  rrect(sx2-2, sy2-2, sw+4, sh+4, 8); ctx.fill();
  if(state.superCd <= 0){
    var pulse2 = 0.6 + 0.4*Math.sin(state.time*6);
    ctx.fillStyle = 'rgba(197,139,255,' + pulse2 + ')';
    rrect(sx2, sy2, sw, sh, 6); ctx.fill();
    txt('ПРОБЕЛ — СВЕРХНОВА', sx2 + sw/2, sy2 + sh/2 + 1, 11, '#1a0b26', 'center');
  } else {
    var fp = 1 - state.superCd/SUPER_CD;
    ctx.fillStyle = '#6b4ba8';
    rrect(sx2, sy2, sw*fp, sh, 6); ctx.fill();
    txt('СУПЕРУДАР: ' + Math.ceil(state.superCd) + 'с', sx2 + sw/2, sy2 + sh/2 + 1, 11, '#dfe8ff', 'center');
  }

  /* таймер до следующего падения оружия */
  var left = Math.ceil(DROP_EVERY - state.dropTimer);
  txt('до оружия: ' + left + 'с', W - 26, 30, 13, 'rgba(255,209,102,0.85)', 'right');
  txt('ESC — пауза', W - 26, 50, 12, 'rgba(200,215,240,0.5)', 'right');
}

function fmtTime(t){
  var m = Math.floor(t/60), s = Math.floor(t%60);
  return m + ':' + (s<10?'0':'') + s;
}

/* ============================================================
   ЭКРАНЫ
   ============================================================ */
function drawOverlay(){
  if(state.mode === 'menu'){
    dim(0.72);
    txt('НЕОН', W/2, H/2 - 120, Math.min(96, W*0.14), '#eaf6ff', 'center');
    txt('ВЫЖИВАНИЕ', W/2, H/2 - 46, Math.min(44, W*0.062), '#7ef9ff', 'center');

    txt('WASD / стрелки — движение', W/2, H/2 + 34, 17, '#c8d7f0', 'center');
    txt('стрельба автоматическая', W/2, H/2 + 62, 17, '#c8d7f0', 'center');
    txt('ПРОБЕЛ — сверхновая (30 сек)', W/2, H/2 + 90, 17, '#c58bff', 'center');
    txt('ESC — пауза', W/2, H/2 + 118, 17, '#c8d7f0', 'center');
    txt('каждые 45 секунд рядом падает ОРУЖИЕ — дойди и подбери', W/2, H/2 + 152, 15, '#ffd166', 'center');

    var bl = 0.5 + 0.5*Math.sin(performance.now()/380);
    txt('НАЖМИ ENTER', W/2, H/2 + 214, 26, 'rgba(234,246,255,' + bl + ')', 'center');
    return;
  }

  if(state.mode === 'pause'){
    dim(0.66);
    txt('ПАУЗА', W/2, H/2 - 130, 58, '#eaf6ff', 'center');
    txt('время ' + fmtTime(state.time) + '   ·   убито ' + state.kills + '   ·   ур. ' + player.level,
        W/2, H/2 - 70, 17, '#c8d7f0', 'center');
    txt('оружие: ' + (weapons.length ? weapons.map(function(w){ return w.def.name; }).join(', ') : 'нет'),
        W/2, H/2 - 36, 14, 'rgba(200,215,240,0.75)', 'center');
    txt('ESC / P — продолжить', W/2, H/2 + 30, 20, '#7ef9ff', 'center');
    txt('R — начать заново', W/2, H/2 + 62, 17, '#ff9fb6', 'center');
    return;
  }

  if(state.mode === 'levelup' || state.mode === 'weapon'){
    dim(0.72);
    var title = state.mode === 'levelup' ? 'УРОВЕНЬ ' + player.level : 'ОРУЖИЕ ИЗ ЯЩИКА';
    var col = state.mode === 'levelup' ? '#7ef9ff' : '#ffd166';
    txt(title, W/2, H*0.24, 40, col, 'center');
    txt(state.mode === 'levelup' ? 'выбери улучшение' : 'выбери ствол — он останется навсегда',
        W/2, H*0.24 + 38, 16, '#c8d7f0', 'center');

    var cw = 230, ch = 150, gap = 22;
    var totalW = cw*3 + gap*2;
    var startX = W/2 - totalW/2;
    var y0 = H*0.36;

    for(var i=0;i<choices.length;i++){
      var c = choices[i];
      var x0 = startX + i*(cw+gap);
      var hov = true;

      ctx.fillStyle = 'rgba(12,18,30,0.92)';
      rrect(x0, y0, cw, ch, 14); ctx.fill();
      ctx.strokeStyle = c.color || '#7ef9ff';
      ctx.lineWidth = 2;
      rrect(x0, y0, cw, ch, 14); ctx.stroke();

      txt((i+1), x0 + 16, y0 + 20, 15, c.color || '#7ef9ff', 'left');
      if(c.icon) txt(c.icon, x0 + cw/2, y0 + 40, 26, '#fff', 'center');
      txt(c.n, x0 + cw/2, y0 + 78, 17, '#eaf6ff', 'center');
      wrapText(c.d, x0 + cw/2, y0 + 106, cw - 28, 15, 'rgba(190,208,235,0.85)');
      txt('нажми ' + (i+1), x0 + cw/2, y0 + ch - 18, 12, 'rgba(160,180,210,0.8)', 'center');
    }
    return;
  }

  if(state.mode === 'dead'){
    dim(0.78);
    txt('ТЫ ПАЛ', W/2, H/2 - 150, 62, '#ff5577', 'center');
    txt('время: ' + fmtTime(state.time), W/2, H/2 - 80, 24, '#eaf6ff', 'center');
    txt('убито: ' + state.kills, W/2, H/2 - 46, 24, '#eaf6ff', 'center');
    txt('уровень: ' + player.level, W/2, H/2 - 12, 24, '#eaf6ff', 'center');
    txt('оружие: ' + (weapons.length ? weapons.length + ' шт.' : 'нет'), W/2, H/2 + 22, 16, '#c8d7f0', 'center');
    var bl = 0.5 + 0.5*Math.sin(performance.now()/380);
    txt('R — заново', W/2, H/2 + 90, 26, 'rgba(234,246,255,' + bl + ')', 'center');
  }
}

function dim(a){
  ctx.fillStyle = 'rgba(4,6,12,' + a + ')';
  ctx.fillRect(0,0,W,H);
}

function wrapText(text, cx, cy, maxW, size, color){
  ctx.font = 'bold ' + size + 'px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var words = String(text).split(' ');
  var line = '', lines = [];
  for(var i=0;i<words.length;i++){
    var test = line ? line + ' ' + words[i] : words[i];
    if(ctx.measureText(test).width > maxW && line){
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);
  for(var j=0;j<lines.length;j++){
    ctx.fillText(lines[j], cx, cy + j*(size+4));
  }
}

/* ============================================================
   ИГРОВОЙ ЦИКЛ
   ============================================================ */
var last = 0;

function loop(now){
  if(!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;

  if(state.hitstop > 0){
    state.hitstop -= dt;
    state.timeScale = 0.28;
  } else {
    state.timeScale = Math.min(1, state.timeScale + dt*3);
  }

  var sdt = dt * state.timeScale;

  if(state.mode === 'play'){
    state.time += sdt;
    updateWorld(sdt);
  }

  /* затухание эффектов камеры идёт всегда */
  if(state.shake > 0) state.shake = Math.max(0, state.shake - dt*38);
  if(state.flash > 0) state.flash = Math.max(0, state.flash - dt*2.6);

  draw();
  requestAnimationFrame(loop);
}

/* ---------------- СТАРТ ---------------- */
resize();
resetGame();
requestAnimationFrame(loop);
</script>
