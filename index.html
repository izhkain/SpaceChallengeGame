<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>НЕОН-ВЫЖИВАНИЕ</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#03040a;color:#eaf2ff;
    font-family:system-ui,'Segoe UI',Roboto,sans-serif;user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:10px;
    letter-spacing:.14em;color:#5d6b8c;pointer-events:none;text-transform:uppercase;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">WASD — движение · ПРОБЕЛ — суперудар · ESC/P — пауза · M — музыка</div>
<script>
"use strict";

/* =========================================================
   БАЗА
   ========================================================= */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const hexA = (h, a) => {
  const n = parseInt(h.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = innerWidth, H = innerHeight, DPR = Math.min(2, devicePixelRatio || 1);

function resize() {
  W = Math.max(320, innerWidth);
  H = Math.max(240, innerHeight);
  cv.width = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBackground();
}

/* =========================================================
   КОСМИЧЕСКИЙ ФОН
   ========================================================= */
let stars = [], dust = [], shooters = [], nebula = null, galaxy = null, gpos = { x: 0, y: 0 };
let bgT = 0, shooterCd = 1.5;

function makeNebula() {
  const s = 0.62;
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.floor(W * s));
  c.height = Math.max(2, Math.floor(H * s));
  const g = c.getContext('2d');
  const pal = ['#5b2ea6', '#1d3f96', '#8a1f6e', '#0f6f82', '#3a1a7a', '#2b60b0', '#6b2f9e'];
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 22; i++) {
    const x = rnd(0, c.width), y = rnd(0, c.height);
    const r = rnd(c.width * 0.16, c.width * 0.55);
    const col = pal[i % pal.length];
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, hexA(col, 0.22));
    grd.addColorStop(0.45, hexA(col, 0.10));
    grd.addColorStop(1, hexA(col, 0));
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  for (let i = 0; i < 140; i++) {
    const x = rnd(0, c.width), y = rnd(0, c.height), r = rnd(6, 58);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(200,225,255,0.09)');
    grd.addColorStop(1, 'rgba(120,170,255,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  return c;
}

function makeGalaxy() {
  const S = 440;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  g.globalCompositeOperation = 'lighter';
  const arms = 3, per = 560;
  for (let a = 0; a < arms; a++) {
    for (let i = 0; i < per; i++) {
      const t = i / per;
      const ang = a * (TAU / arms) + t * 4.6;
      const rad = 8 + t * S * 0.44;
      const x = S / 2 + Math.cos(ang) * rad + rnd(-1, 1) * t * 15;
      const y = S / 2 + Math.sin(ang) * rad * 0.82 + rnd(-1, 1) * t * 15;
      const al = 0.55 * (1 - t);
      g.fillStyle = 'rgba(' + (205 - t * 70 | 0) + ',' + (185 - t * 50 | 0) + ',255,' + al + ')';
      g.fillRect(x, y, rnd(0.7, 2.2), rnd(0.7, 2.2));
    }
  }
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S * 0.24);
  grd.addColorStop(0, 'rgba(255,245,255,0.6)');
  grd.addColorStop(0.4, 'rgba(190,160,255,0.2)');
  grd.addColorStop(1, 'rgba(120,80,200,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(S / 2, S / 2, S * 0.24, 0, TAU); g.fill();
  return c;
}

function buildBackground() {
  stars = [];
  const area = W * H;
  const cols = ['#ffffff', '#cfe4ff', '#a9c8ff', '#ffd7f0', '#c9fff4', '#fff2c9', '#e0d0ff'];
  const layers = [
    { par: 0.08, n: Math.round(area / 6200), r0: 0.35, r1: 1.0, a: 0.38 },
    { par: 0.24, n: Math.round(area / 12000), r0: 0.65, r1: 1.7, a: 0.62 },
    { par: 0.52, n: Math.round(area / 28000), r0: 1.1, r1: 2.5, a: 0.95 }
  ];
  for (const L of layers) {
    for (let i = 0; i < L.n; i++) {
      stars.push({
        x: rnd(0, W), y: rnd(0, H), r: rnd(L.r0, L.r1), a: rnd(0.22, L.a),
        par: L.par, c: pick(cols), ph: rnd(0, TAU), tw: rnd(0.5, 2.8)
      });
    }
  }
  dust = [];
  for (let i = 0; i < 80; i++) {
    dust.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(0.6, 2.3), a: rnd(0.04, 0.2), par: rnd(0.04, 0.28), vx: rnd(-7, 7), vy: rnd(-7, 7) });
  }
  nebula = makeNebula();
  galaxy = makeGalaxy();
  gpos = { x: W * 0.74, y: H * 0.2 };
  shooters = [];
}

function spawnShooter() {
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? rnd(-80, W * 0.4) : rnd(W * 0.6, W + 80);
  const y = rnd(-60, H * 0.5);
  const a = fromLeft ? rnd(0.35, 0.75) : rnd(Math.PI - 0.75, Math.PI - 0.35);
  const sp = rnd(700, 1250);
  shooters.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.6, max: 1.6 });
}

function updateBg(dt) {
  bgT += dt;
  shooterCd -= dt;
  if (shooterCd <= 0) { shooterCd = rnd(1.6, 5.0); spawnShooter(); }
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) shooters.splice(i, 1);
  }
  for (const d of dust) {
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.x < -20) d.x = W + 20; if (d.x > W + 20) d.x = -20;
    if (d.y < -20) d.y = H + 20; if (d.y > H + 20) d.y = -20;
  }
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, W * 0.6, H);
  g.addColorStop(0, '#070a18');
  g.addColorStop(0.45, '#0b0a20');
  g.addColorStop(1, '#04060f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.restore();

  // далёкая галактика
  const gs = Math.max(0.45, Math.min(W, H) / 900);
  let gx = (gpos.x - cam.x * 0.04) % (W + 900); if (gx < 0) gx += W + 900;
  let gy = (gpos.y - cam.y * 0.04) % (H + 900); if (gy < 0) gy += H + 900;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.5;
  ctx.drawImage(galaxy, gx - 450 - galaxy.width * gs / 2, gy - 450 - galaxy.height * gs / 2, galaxy.width * gs, galaxy.height * gs);
  ctx.restore();

  // пыль
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const d of dust) {
    ctx.globalAlpha = d.a;
    ctx.fillStyle = '#9fc4ff';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // звёзды в три слоя
  for (const s of stars) {
    let sx = (s.x - cam.x * s.par) % W; if (sx < 0) sx += W;
    let sy = (s.y - cam.y * s.par) % H; if (sy < 0) sy += H;
    const tw = 0.6 + 0.4 * Math.sin(bgT * s.tw + s.ph);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, TAU); ctx.fill();
    if (s.r > 1.55) {
      ctx.globalAlpha = s.a * tw * 0.3;
      ctx.fillRect(sx - s.r * 3.2, sy - 0.5, s.r * 6.4, 1);
      ctx.fillRect(sx - 0.5, sy - s.r * 3.2, 1, s.r * 6.4);
    }
  }
  ctx.globalAlpha = 1;

  // падающие звёзды
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of shooters) {
    const k = s.life / s.max;
    const tx = s.x - s.vx * 0.09, ty = s.y - s.vy * 0.09;
    const lg = ctx.createLinearGradient(s.x, s.y, tx, ty);
    lg.addColorStop(0, 'rgba(255,255,255,' + (0.85 * k) + ')');
    lg.addColorStop(1, 'rgba(140,200,255,0)');
    ctx.strokeStyle = lg;
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* =========================================================
   МУЗЫКА (процедурный синтез на WebAudio)
   ========================================================= */
const PROG = [
  { bass: 33, pad: [57, 60, 64, 69], arp: [69, 72, 76, 81] },
  { bass: 29, pad: [53, 57, 60, 65], arp: [65, 69, 72, 77] },
  { bass: 36, pad: [55, 60, 64, 67], arp: [67, 72, 76, 79] },
  { bass: 31, pad: [55, 59, 62, 67], arp: [67, 71, 74, 79] }
];

const Music = {
  ctx: null, master: null, delay: null, noise: null,
  on: true, started: false, timer: null, step: 0, next: 0,
  bpm: 104, intensity: 0, vol: 0.22,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = new AC();
      this.ctx = c;
      const m = c.createGain();
      m.gain.value = 0.0001;
      m.connect(c.destination);
      this.master = m;

      const dl = c.createDelay(1.0);
      dl.delayTime.value = 0.29;
      const fb = c.createGain(); fb.gain.value = 0.34;
      const wet = c.createGain(); wet.gain.value = 0.32;
      dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(m);
      this.delay = dl;

      const len = Math.floor(c.sampleRate * 1.2);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;

      this.step = 0;
      this.next = c.currentTime + 0.08;
      m.gain.exponentialRampToValueAtTime(this.on ? this.vol : 0.0001, c.currentTime + 2.0);
      this.started = true;
      this.timer = setInterval(() => this.schedule(), 26);
    } catch (e) { console.warn('audio error', e); }
  },

  toggle() {
    this.on = !this.on;
    if (!this.ctx) { if (this.on) this.init(); return this.on; }
    const c = this.ctx;
    this.master.gain.cancelScheduledValues(c.currentTime);
    this.master.gain.setTargetAtTime(this.on ? this.vol : 0.0001, c.currentTime, 0.12);
    if (c.state === 'suspended') c.resume();
    return this.on;
  },

  schedule() {
    const c = this.ctx;
    if (!c || !this.on) return;
    const stepDur = 60 / this.bpm / 4;
    while (this.next < c.currentTime + 0.2) {
      this.playStep(this.step, this.next);
      this.next += stepDur;
      this.step = (this.step + 1) % 64;
    }
  },

  playStep(s, t) {
    const ch = PROG[((s / 16) | 0) % PROG.length];
    const sub = s % 16;
    if (sub === 0) this.pad(ch.pad, t, (60 / this.bpm) * 4 * 0.97);
    if (sub % 2 === 0) {
      const idx = (sub / 2) | 0;
      const off = (idx === 3 || idx === 7) ? 12 : (idx === 5 ? 7 : 0);
      this.bass(mtof(ch.bass + off), t, 0.22);
    }
    this.arp(mtof(ch.arp[s % 4] + (Math.random() < 0.1 ? 12 : 0)), t, 0.16);
    if (sub === 0 || sub === 8) this.kick(t);
    if (sub === 4 || sub === 12) this.snare(t);
    if (sub % 2 === 1) this.hat(t, sub % 4 === 3 ? 0.05 : 0.028);
    if (this.intensity > 0.4 && sub % 2 === 0) this.hat(t, 0.018);
  },

  pad(notes, t, dur) {
    const c = this.ctx;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.07, t + dur * 0.35);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    const f = c.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 1050 + this.intensity * 950;
    f.Q.value = 0.7;
    g.connect(f); f.connect(this.master);
    for (let i = 0; i < notes.length; i++) {
      for (const det of [-7, 7]) {
        const o = c.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = mtof(notes[i]);
        o.detune.value = det;
        o.connect(g);
        o.start(t); o.stop(t + dur + 0.1);
      }
    }
  },

  bass(freq, t, dur) {
    const c = this.ctx;
    const o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.15, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 430;
    o.connect(g); g.connect(f); f.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },

  arp(freq, t, dur) {
    const c = this.ctx;
    const o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.045, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(this.master);
    g.connect(this.delay);
    o.start(t); o.stop(t + dur + 0.05);
  },

  kick(t) {
    const c = this.ctx;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(125, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
    const g = c.createGain();
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.3);
  },

  hat(t, v) {
    const c = this.ctx;
    const s = c.createBufferSource();
    s.buffer = this.noise;
    const g = c.createGain();
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    const f = c.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 7200;
    s.connect(g); g.connect(f); f.connect(this.master);
    s.start(t); s.stop(t + 0.07);
  },

  snare(t) {
    const c = this.ctx;
    const s = c.createBufferSource();
    s.buffer = this.noise;
    const g = c.createGain();
    g.gain.setValueAtTime(0.13, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.9;
    s.connect(g); g.connect(f); f.connect(this.master);
    s.start(t); s.stop(t + 0.2);
  }
};

/* =========================================================
   ХЕЛПЕРЫ
   ========================================================= */
function nearestEnemy(x, y, maxD, exclude) {
  let best = null, bd = (maxD || 1e9) * (maxD || 1e9);
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    if (exclude && exclude.has(e.id)) continue;
    const dx = e.x - x, dy = e.y - y, d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; best = e; }
  }
  return best;
}

function spawnParticle(x, y, color, speed, life) {
  const a = rnd(0, TAU), sp = rnd(speed * 0.3, speed);
  particles.push({
    x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    r: rnd(1.4, 3.6), life: life || rnd(0.3, 0.8), max: life || 0.7, color
  });
}

function addFloat(x, y, text, color) {
  floats.push({ x, y, text, color: color || '#eaf2ff', life: 1.4, max: 1.4 });
}

function spawnPickup(x, y, kind, val, def) {
  pickups.push({
    x, y, kind, val: val || 1, def: def || null,
    vx: rnd(-30, 30), vy: rnd(-30, 30),
    r: kind === 'weapon' || kind === 'crateBoss' ? 16 : 6,
    life: kind === 'weapon' ? DROP_LIFE : (kind === 'crateBoss' ? 1e9 : 26),
    color: kind === 'hp' ? '#7ef0c0' : (kind === 'weapon' ? (def ? def.color : '#fff') : (kind === 'crateBoss' ? '#ffd166' : '#8ab8ff'))
  });
}

/* =========================================================
   УРОН / СМЕРТЬ ВРАГОВ
   ========================================================= */
function hurtEnemy(e, dmg, opt) {
  if (!e || e.dead) return;
  e.hp -= dmg;
  e.flash = 0.1;
  if (opt) {
    if (opt.knock) {
      const a = Math.atan2(e.y - P.y, e.x - P.x);
      e.x += Math.cos(a) * opt.knock;
      e.y += Math.sin(a) * opt.knock;
    }
    if (opt.slow) { e.slow = Math.max(e.slow || 0, opt.slow); e.slowAmt = Math.min(e.slowAmt || 1, opt.amt || 0.5); }
    if (opt.burn) e.burn = Math.max(e.burn || 0, 1.6);
  }
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  kills++;
  const n = e.boss ? 42 : 7;
  for (let i = 0; i < n; i++) spawnParticle(e.x, e.y, e.color, e.boss ? 430 : 210);
  if (e.boss) {
    bossRef = null;
    shake = 22; flash = 0.45;
    ebullets.length = 0;
    for (let i = 0; i < 26; i++) spawnPickup(e.x + rnd(-70, 70), e.y + rnd(-70, 70), 'xp', 4);
    spawnPickup(e.x, e.y, 'crateBoss');
    P.hp = Math.min(P.maxHp, P.hp + 25);
    addFloat(e.x, e.y - 30, 'БОСС ПОВЕРЖЕН!', '#ffd166');
  } else {
    spawnPickup(e.x, e.y, 'xp', e.xp);
    if (Math.random() < 0.035) spawnPickup(e.x, e.y, 'hp');
  }
}

function hitPlayer(dmg) {
  if (P.inv > 0) return;
  P.hp -= dmg;
  P.inv = 0.75;
  shake = Math.max(shake, 11);
  flash = Math.max(flash, 0.2);
  for (let i = 0; i < 10; i++) spawnParticle(P.x, P.y, '#ff6b8a', 250);
  if (P.hp <= 0) {
    P.hp = 0;
    state = 'dead';
    for (let i = 0; i < 60; i++) spawnParticle(P.x, P.y, '#8adcff', 420);
    shake = 26;
  }
}

/* =========================================================
   ВЫСТРЕЛЫ
   ========================================================= */
function pushBullet(a, dmg, d, o) {
  const sp = o.speed || 900;
  bullets.push({
    x: P.x, y: P.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    r: o.r || 4.5, dmg, life: o.life || 1.6, pierce: o.pierce || 0,
    color: d.color, homing: o.homing || 0, explode: o.explode || 0,
    cluster: o.cluster || 0, bounce: o.bounce || 0, ret: !!o.ret,
    burn: o.burn || 0, slow: o.slow || 0, slowAmt: o.amt || 0.5,
    hitIds: {}, phase: 0, ang: a, long: !!o.long, spin: o.spin || 0
  });
}

function castBeam(a, dmg, pierce, range, color) {
  const cs = Math.cos(a), sn = Math.sin(a);
  const hits = [];
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    const dx = e.x - P.x, dy = e.y - P.y;
    const t = dx * cs + dy * sn;
    if (t < 0 || t > range) continue;
    const perp = Math.abs(-dx * sn + dy * cs);
    if (perp < e.r + 12) hits.push({ e, t });
  }
  hits.sort((p, q) => p.t - q.t);
  let n = 0;
  for (const h of hits) {
    if (n >= pierce) break;
    hurtEnemy(h.e, dmg);
    n++;
  }
  const len = hits.length ? Math.min(range, hits[Math.min(hits.length - 1, pierce - 1)].t + 50) : range * 0.5;
  effects.push({ kind: 'beam', x: P.x, y: P.y, a, len, color, life: 0.16, max: 0.16 });
}

function fireWeapon(w) {
  const d = w.def;
  const mult = Math.pow(1.28, w.stack - 1);
  const dmg = d.dmg * P.dmgMul * mult;
  const tgt = nearestEnemy(P.x, P.y, 1400);
  const baseA = tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : P.face;

  switch (d.type) {
    case 'auto': {
      const n = d.count || 1, sp = d.spread || 0;
      for (let i = 0; i < n; i++) {
        const a = baseA + (n > 1 ? (-sp / 2 + sp * i / (n - 1)) : rnd(-0.04, 0.04));
        pushBullet(a, dmg, d, { speed: d.speed || 1000, pierce: d.pierce || 0, homing: d.homing || 0, life: 1.6 });
      }
      break;
    }
    case 'sniper':
      pushBullet(baseA, dmg, d, { speed: d.speed || 1600, pierce: d.pierce || 4, life: 2.0, r: 6, long: true });
      break;
    case 'blade':
      pushBullet(baseA, dmg, d, { speed: d.speed || 1000, pierce: 3, life: 1.4, r: 9, spin: 16 });
      break;
    case 'beam': {
      const n = d.count || 1, sp = d.spread || 0;
      for (let i = 0; i < n; i++) {
        const a = baseA + (n > 1 ? (-sp / 2 + sp * i / (n - 1)) : 0);
        castBeam(a, dmg, d.pierce || 2, d.range || 800, d.color);
      }
      break;
    }
    case 'rocket': {
      const n = d.count || 1;
      for (let i = 0; i < n; i++) {
        const a = baseA + (n > 1 ? rnd(-0.3, 0.3) : rnd(-0.05, 0.05));
        pushBullet(a, dmg, d, {
          speed: d.speed || 420, life: 2.2, r: 6,
          homing: d.homing || 0, explode: d.explode || 70, cluster: d.cluster || 0
        });
      }
      break;
    }
    case 'chain': {
      let pos = { x: P.x, y: P.y };
      const used = new Set();
      const segs = [];
      for (let i = 0; i < (d.chain || 4); i++) {
        const e = nearestEnemy(pos.x, pos.y, 350, used);
        if (!e) break;
        used.add(e.id);
        segs.push([pos.x, pos.y, e.x, e.y]);
        hurtEnemy(e, dmg);
        pos = { x: e.x, y: e.y };
      }
      if (segs.length) effects.push({ kind: 'chain', segs, color: d.color, life: 0.18, max: 0.18 });
      break;
    }
    case 'shotgun': {
      const n = d.count || 6, sp = d.spread || 0.9;
      for (let i = 0; i < n; i++) {
        const a = baseA + rnd(-sp / 2, sp / 2);
        pushBullet(a, dmg, d, { speed: d.speed || 820, life: 0.62, r: 4, pierce: d.pierce || 0, bounce: d.bounce || 0 });
      }
      break;
    }
    case 'ring': {
      const n = d.count || 12;
      for (let i = 0; i < n; i++) {
        pushBullet((i / n) * TAU + gameTime, dmg, d, { speed: d.speed || 620, life: 1.5, r: 5, pierce: 1 });
      }
      break;
    }
    case 'nova':
      waves.push({ x: P.x, y: P.y, r: 8, maxR: d.maxR || 220, speed: d.speed || 520, dmg, hit: {}, color: d.color, knock: d.knock || 0, w: 6 });
      break;
    case 'mine': {
      const n = d.count || 1;
      for (let i = 0; i < n; i++) {
        mines.push({ x: P.x + rnd(-45, 45), y: P.y + rnd(-45, 45), r: 9, dmg, mineR: d.mineR || 80, life: 16, color: d.color, t: 0 });
      }
      break;
    }
    case 'spiral': {
      const n = d.count || 1;
      w.ang = (w.ang || 0) + (d.step || 0.4);
      for (let i = 0; i < n; i++) {
        pushBullet(w.ang + i * TAU / n, dmg, d, { speed: d.speed || 800, life: 1.6, r: 5 });
      }
      break;
    }
    case 'boomerang': {
      const n = d.count || 1;
      for (let i = 0; i < n; i++) {
        const a = baseA + (n > 1 ? i * TAU / n : 0);
        pushBullet(a, dmg, d, { speed: d.speed || 700, life: 2.4, r: 9, pierce: 99, ret: true });
      }
      break;
    }
    case 'bounce':
      pushBullet(baseA, dmg, d, { speed: d.speed || 720, life: 3.2, r: 7, pierce: 99, bounce: d.bounce || 3 });
      break;
    case 'flame': {
      for (let i = 0; i < 3; i++) {
        const a = baseA + rnd(-0.34, 0.34);
        bullets.push({
          x: P.x + Math.cos(a) * 18, y: P.y + Math.sin(a) * 18,
          vx: Math.cos(a) * rnd(360, 580), vy: Math.sin(a) * rnd(360, 580),
          r: rnd(7, 12), dmg: dmg * 0.55, life: 0.34, pierce: 2, color: d.color,
          homing: 0, explode: 0, cluster: 0, bounce: 0, ret: false,
          burn: d.burn ? 1.6 : 0, slow: d.slow ? 1 : 0, slowAmt: d.amt || 0.5,
          hitIds: {}, phase: 0, ang: a, long: false, spin: 0
        });
      }
      break;
    }
  }
}

/* =========================================================
   ОРУЖИЕ ИГРОКА
   ========================================================= */
function grantWeapon(def) {
  const ex = P.weapons.find(w => w.def.id === def.id);
  if (ex) {
    ex.stack++;
    addFloat(P.x, P.y - 20, def.name + ' ×' + ex.stack, def.color);
    return;
  }
  if (P.weapons.length >= MAX_WEAPONS) {
    const old = P.weapons.shift();
    addFloat(P.x, P.y - 34, '− ' + old.def.name, '#ff8a8a');
  }
  P.weapons.push({ def, stack: 1, t: 0, ang: rnd(0, TAU), hitCd: 0 });
  addFloat(P.x, P.y - 20, def.name, def.color);
}

function updateWeapons(dt) {
  for (const w of P.weapons) {
    const ty = w.def.type;
    if (ty === 'orbit' || ty === 'aura' || ty === 'drone' || ty === 'gravity') continue;
    w.t -= dt;
    if (w.t <= 0) {
      w.t = w.def.cd / P.rateMul;
      fireWeapon(w);
    }
  }
}

function updatePersistent(dt) {
  for (const w of P.weapons) {
    const d = w.def;
    const mult = Math.pow(1.28, w.stack - 1);

    if (d.type === 'orbit') {
      w.ang += dt * (d.spin || 2.2);
      w.hitCd -= dt;
      if (w.hitCd <= 0) {
        w.hitCd = 0.3;
        const cnt = d.count || 2, rad = d.orbitR || 95;
        for (let i = 0; i < cnt; i++) {
          const a = w.ang + i * TAU / cnt;
          const ox = P.x + Math.cos(a) * rad, oy = P.y + Math.sin(a) * rad;
          const br = d.br || 16;
          for (const e of enemies) {
            if (e.dead) continue;
            const dx = e.x - ox, dy = e.y - oy;
            if (dx * dx + dy * dy < (e.r + br) * (e.r + br)) hurtEnemy(e, d.dmg * mult);
          }
        }
      }
    } else if (d.type === 'aura') {
      w.t -= dt;
      if (w.t <= 0) {
        w.t = 0.3;
        const R = d.auraR + P.r;
        for (const e of enemies) {
          if (e.dead) continue;
          const dx = e.x - P.x, dy = e.y - P.y;
          if (dx * dx + dy * dy < (R + e.r) * (R + e.r)) {
            hurtEnemy(e, d.dmg * mult * 0.3 * 4, { slow: d.slow ? 1.0 : 0, amt: d.amt, burn: !!d.burn });
            if (d.heal) P.hp = Math.min(P.maxHp, P.hp + d.heal);
          }
        }
      }
    } else if (d.type === 'drone') {
      w.ang += dt * 1.15;
      w.t -= dt;
      if (w.t <= 0) {
        w.t = d.cd / P.rateMul;
        const cnt = d.count || 1;
        for (let i = 0; i < cnt; i++) {
          const a = w.ang + i * TAU / cnt;
          const dx = P.x + Math.cos(a) * (d.orbitR || 70);
          const dy = P.y + Math.sin(a) * (d.orbitR || 70);
          const tgt = nearestEnemy(dx, dy, 900);
          if (!tgt) continue;
          const aa = Math.atan2(tgt.y - dy, tgt.x - dx);
          bullets.push({
            x: dx, y: dy, vx: Math.cos(aa) * (d.speed || 700), vy: Math.sin(aa) * (d.speed || 700),
            r: 4, dmg: d.dmg * mult, life: 1.2, pierce: 0, color: d.color,
            homing: 0, explode: 0, cluster: 0, bounce: 0, ret: false,
            burn: 0, slow: 0, slowAmt: 0.5, hitIds: {}, phase: 0, ang: aa, long: false, spin: 0
          });
        }
      }
    } else if (d.type === 'gravity') {
      w.t -= dt;
      if (w.t <= 0) {
        w.t = d.cd;
        const tgt = nearestEnemy(P.x, P.y, 700);
        wells.push({
          x: tgt ? tgt.x : P.x + rnd(-140, 140),
          y: tgt ? tgt.y : P.y + rnd(-140, 140),
          r: d.wellR || 170, life: d.dur || 1.6, max: d.dur || 1.6,
          pull: d.pull || 260, dps: d.dmg * mult * 2.2, color: d.color
        });
      }
    }
  }
}

/* =========================================================
   ВРАГИ
   ========================================================= */
function spawnEnemy() {
  const t = gameTime;
  const diff = 1 + t / 55;
  let type = 'slime';
  const roll = Math.random();
  if (t > 22 && roll < 0.32) type = 'runner';
  else if (t > 55 && roll > 0.78) type = 'brute';
  const b = ENEMY_TYPES[type];
  const a = rnd(0, TAU), d = Math.max(W, H) * 0.62;
  enemies.push({
    x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d,
    r: b.r, hp: b.hp * diff, maxHp: b.hp * diff,
    speed: b.speed * (1 + t / 620), color: b.color, xp: b.xp, dmg: b.dmg,
    flash: 0, id: uid++, boss: false, slow: 0, slowAmt: 1, burn: 0, dead: false
  });
}

function spawnBoss() {
  bossTier++;
  const a = rnd(0, TAU), d = Math.max(W, H) * 0.62;
  const hp = 620 + bossTier * 560;
  const e = {
    x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, r: 34,
    hp, maxHp: hp, speed: 48 + bossTier * 5, color: '#ff5f8f',
    xp: 40, dmg: 22, flash: 0, id: uid++, boss: true,
    shootCd: 2.0, dashCd: 3.4, dash: 0, dvx: 0, dvy: 0,
    slow: 0, slowAmt: 1, burn: 0, dead: false
  };
  enemies.push(e);
  bossRef = e;
  shake = 18; flash = 0.35;
  addFloat(P.x, P.y - 60, 'ВНИМАНИЕ: БОСС', '#ff5f8f');
}

function updateBoss(e, dt, sp) {
  e.shootCd -= dt;
  e.dashCd -= dt;
  if (e.dash > 0) {
    e.dash -= dt;
    e.x += e.dvx * dt;
    e.y += e.dvy * dt;
  } else {
    const a = Math.atan2(P.y - e.y, P.x - e.x);
    e.x += Math.cos(a) * sp * dt;
    e.y += Math.sin(a) * sp * dt;
    if (e.dashCd <= 0) {
      e.dashCd = rnd(2.6, 4.2);
      e.dash = 0.42;
      const dv = 520 + bossTier * 22;
      e.dvx = Math.cos(a) * dv;
      e.dvy = Math.sin(a) * dv;
    }
  }
  if (e.shootCd <= 0) {
    e.shootCd = Math.max(0.9, 2.2 - bossTier * 0.09);
    const n = 5 + bossTier * 2;
    const base = Math.atan2(P.y - e.y, P.x - e.x);
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * 0.22;
      ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 265, vy: Math.sin(a) * 265, r: 6, dmg: 12, life: 3.4, color: '#ff7aa8' });
    }
  }
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dead) { enemies.splice(i, 1); continue; }
    if (e.flash > 0) e.flash -= dt;
    let sp = e.speed;
    if (e.slow > 0) { e.slow -= dt; sp *= (e.slowAmt || 0.5); }
    if (e.burn > 0) {
      e.burn -= dt;
      e.hp -= 9 * dt;
      if (e.hp <= 0) { killEnemy(e); continue; }
    }
    if (e.boss) updateBoss(e, dt, sp);
    else {
      const a = Math.atan2(P.y - e.y, P.x - e.x);
      e.x += Math.cos(a) * sp * dt;
      e.y += Math.sin(a) * sp * dt;
    }
    const dx = e.x - P.x, dy = e.y - P.y;
    if (dx * dx + dy * dy < (e.r + P.r) * (e.r + P.r)) hitPlayer(e.dmg);
  }
}

/* =========================================================
   ПУЛИ И ЭФФЕКТЫ
   ========================================================= */
function explodeAt(x, y, radius, dmg, color, cluster) {
  waves.push({ x, y, r: 10, maxR: radius, speed: radius * 4.2, dmg, hit: {}, color, knock: 0, w: 5 });
  for (let i = 0; i < 14; i++) spawnParticle(x, y, color, 300);
  if (cluster) {
    for (let i = 0; i < cluster; i++) {
      const a = (i / cluster) * TAU;
      waves.push({
        x: x + Math.cos(a) * 26, y: y + Math.sin(a) * 26,
        r: 6, maxR: radius * 0.6, speed: radius * 3.4,
        dmg: dmg * 0.55, hit: {}, color, knock: 0, w: 4
      });
    }
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;

    if (b.homing > 0) {
      const t = nearestEnemy(b.x, b.y, 560);
      if (t) {
        const want = Math.atan2(t.y - b.y, t.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let diff = ((want - cur + Math.PI * 3) % TAU) - Math.PI;
        const na = cur + clamp(diff, -b.homing * dt, b.homing * dt);
        const sp = Math.hypot(b.vx, b.vy) || 1;
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
    }

    if (b.ret) {
      b.phase += dt;
      if (b.phase > 0.44) {
        const a = Math.atan2(P.y - b.y, P.x - b.x);
        b.vx += Math.cos(a) * 1700 * dt;
        b.vy += Math.sin(a) * 1700 * dt;
        const cur = Math.hypot(b.vx, b.vy);
        if (cur > 1450) { b.vx *= 1450 / cur; b.vy *= 1450 / cur; }
        b.hitIds = {};
      }
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if (b.bounce > 0) {
      const sx = b.x - cam.x, sy = b.y - cam.y;
      if (sx < 0) { b.x = cam.x; b.vx = Math.abs(b.vx); b.bounce--; }
      else if (sx > W) { b.x = cam.x + W; b.vx = -Math.abs(b.vx); b.bounce--; }
      if (sy < 0) { b.y = cam.y; b.vy = Math.abs(b.vy); b.bounce--; }
      else if (sy > H) { b.y = cam.y + H; b.vy = -Math.abs(b.vy); b.bounce--; }
    }

    let hitSomething = false;
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (e.dead || b.hitIds[e.id]) continue;
      const dx = e.x - b.x, dy = e.y - b.y;
      if (dx * dx + dy * dy < (e.r + b.r) * (e.r + b.r)) {
        b.hitIds[e.id] = 1;
        hurtEnemy(e, b.dmg, { burn: b.burn > 0, slow: b.slow, amt: b.slowAmt });
        hitSomething = true;
        if (b.explode) { explodeAt(b.x, b.y, b.explode, b.dmg * 0.7, b.color, b.cluster); b.life = 0; break; }
        if (b.pierce > 0) b.pierce--;
        else { b.life = 0; break; }
      }
    }
    if (hitSomething && b.ret) { /* бумеранг летит дальше */ }
    if (b.life <= 0) {
      if (b.explode) explodeAt(b.x, b.y, b.explode, b.dmg * 0.7, b.color, b.cluster);
      bullets.splice(i, 1);
    }
  }
}

function updateEnemyBullets(dt) {
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.life -= dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    const dx = b.x - P.x, dy = b.y - P.y;
    if (dx * dx + dy * dy < (P.r + b.r) * (P.r + b.r)) {
      hitPlayer(b.dmg);
      ebullets.splice(i, 1);
      continue;
    }
    if (b.life <= 0) ebullets.splice(i, 1);
  }
}

function updateWaves(dt) {
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.r += w.speed * dt;
    for (const e of enemies) {
      if (e.dead || w.hit[e.id]) continue;
      const dx = e.x - w.x, dy = e.y - w.y;
      if (dx * dx + dy * dy < (w.r + e.r) * (w.r + e.r)) {
        w.hit[e.id] = 1;
        hurtEnemy(e, w.dmg, { knock: w.knock });
      }
    }
    if (w.r > w.maxR) waves.splice(i, 1);
  }
}

function updateMines(dt) {
  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i];
    m.life -= dt;
    m.t += dt;
    let boom = m.life <= 0;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - m.x, dy = e.y - m.y;
      if (dx * dx + dy * dy < (m.mineR * 0.55 + e.r) * (m.mineR * 0.55 + e.r)) { boom = true; break; }
    }
    if (boom) {
      explodeAt(m.x, m.y, m.mineR, m.dmg, m.color, 0);
      mines.splice(i, 1);
    }
  }
}

function updateWells(dt) {
  for (let i = wells.length - 1; i >= 0; i--) {
    const w = wells[i];
    w.life -= dt;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = w.x - e.x, dy = w.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < w.r) {
        const k = (1 - d / w.r) * w.pull * dt;
        e.x += dx / d * k;
        e.y += dy / d * k;
        hurtEnemy(e, w.dps * dt);
      }
    }
    if (w.life <= 0) wells.splice(i, 1);
  }
}

function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt;
    if (p.life <= 0) { pickups.splice(i, 1); continue; }
    if (p.kind === 'xp') {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.96; p.vy *= 0.96;
      const dx = P.x - p.x, dy = P.y - p.y, d2 = dx * dx + dy * dy;
      if (d2 < P.magnet * P.magnet) {
        const d = Math.sqrt(d2) || 1;
        p.x += dx / d * 470 * dt;
        p.y += dy / d * 470 * dt;
      }
      if (d2 < (P.r + p.r + 6) * (P.r + p.r + 6)) { gainXp(p.val); pickups.splice(i, 1); }
    } else {
      const dx = P.x - p.x, dy = P.y - p.y, d2 = dx * dx + dy * dy;
      const reach = P.r + p.r + 14;
      if (d2 < reach * reach) {
        if (p.kind === 'hp') {
          P.hp = Math.min(P.maxHp, P.hp + 20);
          addFloat(P.x, P.y - 18, '+20 HP', '#7ef0c0');
        } else if (p.kind === 'weapon') {
          grantWeapon(p.def);
        } else if (p.kind === 'crateBoss') {
          openWeaponChoice();
        }
        pickups.splice(i, 1);
      }
    }
  }
}

/* =========================================================
   ОПЫТ И ВЫБОР АПГРЕЙДОВ
   ========================================================= */
function gainXp(v) {
  xp += v;
  while (xp >= xpNeed) {
    xp -= xpNeed;
    level++;
    xpNeed = Math.ceil(xpNeed * 1.32);
    pendingLevels++;
  }
  if (pendingLevels > 0 && state === 'playing') openUpgrade();
}

function openUpgrade() {
  const pool = UPGRADES.slice();
  cards = [];
  for (let i = 0; i < 3 && pool.length; i++) {
    cards.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
  }
  state = 'upgrade';
}

function chooseUpgrade(idx) {
  const c = cards[idx];
  if (!c) return;
  c.ap();
  pendingLevels--;
  if (pendingLevels > 0) openUpgrade();
  else { state = 'playing'; cards = []; }
}

function openWeaponChoice() {
  const pool = WEAPONS.slice();
  weaponCards = [];
  for (let i = 0; i < 3 && pool.length; i++) {
    weaponCards.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
  }
  state = 'weapon';
}

function chooseWeapon(idx) {
  const d = weaponCards[idx];
  if (!d) return;
  grantWeapon(d);
  state = 'playing';
  weaponCards = [];
}

/* =========================================================
   СУПЕРУДАР И ДРОП
   ========================================================= */
function useSuper() {
  if (state !== 'playing' || P.superCd > 0) return;
  P.superCd = P.superMax;
  const dmg = 140 + P.dmgMul * 60;
  waves.push({ x: P.x, y: P.y, r: 10, maxR: 540, speed: 1500, dmg, hit: {}, color: '#c8a0ff', knock: 95, w: 14 });
  waves.push({ x: P.x, y: P.y, r: 10, maxR: 360, speed: 1100, dmg: dmg * 0.5, hit: {}, color: '#ffffff', knock: 60, w: 8 });
  shake = 24; flash = 0.5; hitstop = 0.14;
  for (let i = 0; i < 80; i++) spawnParticle(P.x, P.y, '#c8a0ff', 430);
  addFloat(P.x, P.y - 44, 'СВЕРХНОВАЯ', '#e0c8ff');
}

function spawnGroundDrop() {
  const a = rnd(0, TAU), d = rnd(260, 430);
  const free = WEAPONS.filter(w => !P.weapons.some(o => o.def.id === w.id));
  const def = free.length ? pick(free) : pick(WEAPONS);
  pickups.push({
    x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d,
    kind: 'weapon', def, val: 1, vx: 0, vy: 0, r: 16,
    life: DROP_LIFE, color: def.color
  });
  addFloat(P.x, P.y - 56, 'ОРУЖИЕ УПАЛО РЯДОМ', def.color);
}

/* =========================================================
   АПДЕЙТ ИГРЫ
   ========================================================= */
function updatePlayer(dt) {
  let mx = 0, my = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mx--;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mx++;
  if (keys.has('KeyW') || keys.has('ArrowUp')) my--;
  if (keys.has('KeyS') || keys.has('ArrowDown')) my++;
  if (mx || my) {
    const l = Math.hypot(mx, my);
    P.x += mx / l * P.speed * dt;
    P.y += my / l * P.speed * dt;
    P.face = Math.atan2(my, mx);
  }
  if (P.inv > 0) P.inv -= dt;
  if (P.regen > 0) P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);
  if (P.superCd > 0) P.superCd = Math.max(0, P.superCd - dt);

  const kx = Math.min(1, dt * 7), ky = Math.min(1, dt * 7);
  cam.x += ((P.x - W / 2) - cam.x) * kx;
  cam.y += ((P.y - H / 2) - cam.y) * ky;

  P.fireCd -= dt;
  if (P.fireCd <= 0) {
    const t = nearestEnemy(P.x, P.y, 1500);
    if (t) {
      P.fireCd = 0.55 / P.rateMul;
      const baseA = Math.atan2(t.y - P.y, t.x - P.x);
      const n = P.bullets;
      for (let i = 0; i < n; i++) {
        const a = baseA + (n > 1 ? (-0.1 + 0.2 * i / (n - 1)) : rnd(-0.03, 0.03));
        bullets.push({
          x: P.x, y: P.y, vx: Math.cos(a) * 680, vy: Math.sin(a) * 680,
          r: 5, dmg: 10 * P.dmgMul, life: 1.5, pierce: P.pierceBonus, color: '#a8f0ff',
          homing: 0, explode: 0, cluster: 0, bounce: 0, ret: false,
          burn: 0, slow: 0, slowAmt: 0.5, hitIds: {}, phase: 0, ang: a, long: false, spin: 0
        });
      }
    }
  }
}

function step(dt) {
  gameTime += dt;

  updatePlayer(dt);
  updateWeapons(dt);
  updatePersistent(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updateEnemyBullets(dt);
  updateWaves(dt);
  updateMines(dt);
  updateWells(dt);
  updatePickups(dt);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= dt;
    f.y -= 26 * dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].life -= dt;
    if (effects[i].life <= 0) effects.splice(i, 1);
  }

  if (shake > 0) shake = Math.max(0, shake - dt * 46);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.9);
  if (dropNotice > 0) dropNotice -= dt;

  // спавн врагов
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = Math.max(0.16, 0.85 - gameTime / 170);
    spawnEnemy();
    if (gameTime > 40 && Math.random() < 0.45) spawnEnemy();
  }

  // боссы
  bossTimer -= dt;
  if (bossTimer <= 0) {
    bossTimer = BOSS_EVERY;
    spawnBoss();
  }

  // оружие на землю
  dropTimer -= dt;
  if (dropTimer <= 0) {
    dropTimer = DROP_EVERY;
    spawnGroundDrop();
  }

  Music.intensity = bossRef ? 1 : clamp(gameTime / 150, 0, 0.8);
}

/* =========================================================
   РЕНДЕР
   ========================================================= */
function glowCircle(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(color, alpha));
  g.addColorStop(0.55, hexA(color, alpha * 0.32));
  g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}

function drawEnemy(e) {
  const c = e.flash > 0 ? '#ffffff' : e.color;
  if (e.boss) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    glowCircle(e.x, e.y, e.r * 2.6, '#ff5f8f', 0.4);
    ctx.restore();
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.62, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#2a0716';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.3, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = hexA(c, 0.85);
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill();
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.55, 0, TAU); ctx.fill();
  }
  if (e.burn > 0) {
    ctx.strokeStyle = 'rgba(255,140,60,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, TAU); ctx.stroke();
  }
  if (e.slow > 0) {
    ctx.strokeStyle = 'rgba(140,220,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 6, 0, TAU); ctx.stroke();
  }
}

function drawWeaponVisuals() {
  for (const w of P.weapons) {
    const d = w.def;
    if (d.type === 'aura') {
      const R = d.auraR;
      const g = ctx.createRadialGradient(P.x, P.y, R * 0.25, P.x, P.y, R + P.r);
      g.addColorStop(0, hexA(d.color, 0.03));
      g.addColorStop(0.75, hexA(d.color, 0.1));
      g.addColorStop(1, hexA(d.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(P.x, P.y, R + P.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = hexA(d.color, 0.35);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(P.x, P.y, R + P.r, 0, TAU); ctx.stroke();
    } else if (d.type === 'orbit') {
      const cnt = d.count || 2, rad = d.orbitR || 95, br = d.br || 16;
      ctx.strokeStyle = hexA(d.color, 0.16);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(P.x, P.y, rad, 0, TAU); ctx.stroke();
      for (let i = 0; i < cnt; i++) {
        const a = w.ang + i * TAU / cnt;
        const ox = P.x + Math.cos(a) * rad, oy = P.y + Math.sin(a) * rad;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        glowCircle(ox, oy, br * 2, d.color, 0.45);
        ctx.restore();
        ctx.fillStyle = d.color;
        ctx.beginPath(); ctx.arc(ox, oy, br * 0.62, 0, TAU); ctx.fill();
      }
    } else if (d.type === 'drone') {
      const cnt = d.count || 1, rad = d.orbitR || 70;
      ctx.strokeStyle = hexA(d.color, 0.12);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(P.x, P.y, rad, 0, TAU); ctx.stroke();
      for (let i = 0; i < cnt; i++) {
        const a = w.ang + i * TAU / cnt;
        const ox = P.x + Math.cos(a) * rad, oy = P.y + Math.sin(a) * rad;
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.moveTo(ox, oy - 7);
        ctx.lineTo(ox + 6, oy + 5);
        ctx.lineTo(ox - 6, oy + 5);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
}

function render() {
  drawBackground();

  ctx.save();
  const sx = shake > 0 ? rnd(-shake, shake) * 0.5 : 0;
  const sy = shake > 0 ? rnd(-shake, shake) * 0.5 : 0;
  ctx.translate(-cam.x + sx, -cam.y + sy);

  // гравитационные воронки
  for (const w of wells) {
    const k = w.life / w.max;
    const g = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r);
    g.addColorStop(0, 'rgba(10,4,24,0.85)');
    g.addColorStop(0.5, hexA(w.color, 0.25 * k));
    g.addColorStop(1, hexA(w.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = hexA(w.color, 0.5 * k);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.7, 0, TAU); ctx.stroke();
  }

  // мины
  for (const m of mines) {
    const pul = 0.5 + 0.5 * Math.sin(m.t * 8);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    glowCircle(m.x, m.y, 22 + pul * 8, m.color, 0.4);
    ctx.restore();
    ctx.fillStyle = m.color;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  }

  // подбираемое
  for (const p of pickups) {
    if (p.kind === 'weapon' || p.kind === 'crateBoss') {
      const bob = Math.sin(performance.now() / 260) * 4;
      const col = p.kind === 'crateBoss' ? '#ffd166' : p.def.color;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      glowCircle(p.x, p.y + bob, 52, col, 0.45);
      const lg = ctx.createLinearGradient(p.x, p.y - 200, p.x, p.y);
      lg.addColorStop(0, hexA(col, 0));
      lg.addColorStop(1, hexA(col, 0.35));
      ctx.fillStyle = lg;
      ctx.fillRect(p.x - 14, p.y - 200, 28, 200);
      ctx.restore();
      ctx.strokeStyle = hexA(col, 0.6);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, 24 + Math.sin(performance.now() / 300) * 3, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#0c1020';
      ctx.fillRect(p.x - 11, p.y + bob - 11, 22, 22);
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.5;
      ctx.strokeRect(p.x - 11, p.y + bob - 11, 22, 22);
      ctx.fillStyle = col;
      ctx.fillRect(p.x - 3, p.y + bob - 3, 6, 6);
      ctx.fillStyle = '#dfe9ff';
      ctx.font = '600 11px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const nm = p.kind === 'crateBoss' ? 'ЯЩИК БОССА' : p.def.name;
      ctx.fillText(nm, p.x, p.y - 30 + bob);
      if (p.kind === 'weapon') {
        ctx.fillStyle = 'rgba(200,215,240,0.6)';
        ctx.font = '10px system-ui,sans-serif';
        ctx.fillText(Math.ceil(p.life) + ' с', p.x, p.y + 30 + bob);
      }
    } else if (p.kind === 'xp') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      glowCircle(p.x, p.y, 14, '#5aa8ff', 0.55);
      ctx.restore();
      ctx.fillStyle = '#bfe0ff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.62, 0, TAU); ctx.fill();
    } else {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      glowCircle(p.x, p.y, 16, '#7ef0c0', 0.6);
      ctx.restore();
      ctx.fillStyle = '#7ef0c0';
      ctx.fillRect(p.x - 6, p.y - 2, 12, 4);
      ctx.fillRect(p.x - 2, p.y - 6, 4, 12);
    }
  }

  // враги
  for (const e of enemies) drawEnemy(e);

  // пули игрока
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    if (b.ret) {
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = hexA(b.color, 0.5);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, b.phase * 12, b.phase * 12 + 4); ctx.stroke();
    } else {
      const ang = Math.atan2(b.vy, b.vx);
      const tl = b.long ? 34 : 13;
      ctx.strokeStyle = hexA(b.color, 0.85);
      ctx.lineWidth = b.r * 0.9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - Math.cos(ang) * tl, b.y - Math.sin(ang) * tl);
      ctx.stroke();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.75, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();

  // пули врагов
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of ebullets) {
    glowCircle(b.x, b.y, b.r * 3, b.color, 0.6);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // кольца-новы
  for (const w of waves) {
    const k = clamp(w.r / w.maxR, 0, 1);
    ctx.strokeStyle = hexA(w.color, (1 - k) * 0.9);
    ctx.lineWidth = (w.w || 6) * (1 - k * 0.6);
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = hexA('#ffffff', (1 - k) * 0.35);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.94, 0, TAU); ctx.stroke();
  }

  // лучи и молнии
  for (const fx of effects) {
    const k = fx.life / fx.max;
    if (fx.kind === 'beam') {
      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.a);
      const g = ctx.createLinearGradient(0, 0, fx.len, 0);
      g.addColorStop(0, hexA(fx.color, 0.95 * k));
      g.addColorStop(1, hexA(fx.color, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, -5 * k, fx.len, 10 * k);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * k) + ')';
      ctx.fillRect(0, -1.5, fx.len, 3);
      ctx.restore();
    } else if (fx.kind === 'chain') {
      ctx.strokeStyle = hexA(fx.color, 0.9 * k);
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (const s of fx.segs) {
        const steps = 5;
        ctx.moveTo(s[0], s[1]);
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const px = s[0] + (s[2] - s[0]) * t + rnd(-9, 9);
          const py = s[1] + (s[3] - s[1]) * t + rnd(-9, 9);
          ctx.lineTo(px, py);
        }
      }
      ctx.stroke();
    }
  }

  // оружие вокруг игрока
  if (P) drawWeaponVisuals();

  // игрок
  if (P && state !== 'dead') {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    glowCircle(P.x, P.y, 62, '#6ad8ff', 0.35);
    if (P.superCd <= 0) {
      const pul = 0.5 + 0.5 * Math.sin(performance.now() / 220);
      ctx.strokeStyle = 'rgba(200,160,255,' + (0.35 + pul * 0.45) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(P.x, P.y, 26 + pul * 4, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    const blink = P.inv > 0 && Math.floor(P.inv * 14) % 2 === 0;
    ctx.fillStyle = blink ? '#ffffff' : '#bfeaff';
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0a1a2e';
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r * 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7ff0ff';
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r * 0.28, 0, TAU); ctx.fill();
  }

  // частицы
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const k = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // всплывающий текст
  for (const f of floats) {
    const k = clamp(f.life / f.max, 0, 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = f.color;
    ctx.font = '700 14px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore(); // конец мира

  // винтетка
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (flash > 0) {
    ctx.fillStyle = 'rgba(200,180,255,' + (flash * 0.5) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (state !== 'menu') drawHUD();
  drawOverlays();
}

/* =========================================================
   HUD
   ========================================================= */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function txt(s, x, y, size, color, align) {
  ctx.fillStyle = color;
  ctx.font = '700 ' + size + 'px system-ui,sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}

function drawHUD() {
  // HP
  const bx = 22, by = 22, bw = 264;
  ctx.fillStyle = 'rgba(10,14,26,0.72)';
  rr(bx, by, bw, 16, 8); ctx.fill();
  const hpK = clamp(P.hp / P.maxHp, 0, 1);
  const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  hg.addColorStop(0, '#ff4d6d');
  hg.addColorStop(1, '#ff9a5c');
  ctx.fillStyle = hg;
  rr(bx, by, Math.max(4, bw * hpK), 16, 8); ctx.fill();
  txt(Math.ceil(P.hp) + ' / ' + P.maxHp, bx + bw / 2, by + 8, 11, '#0a0f1a', 'center');

  // XP
  ctx.fillStyle = 'rgba(10,14,26,0.72)';
  rr(bx, by + 22, bw, 7, 4); ctx.fill();
  ctx.fillStyle = '#5aa8ff';
  rr(bx, by + 22, Math.max(3, bw * clamp(xp / xpNeed, 0, 1)), 7, 4); ctx.fill();

  txt('УР. ' + level, bx, by + 48, 13, '#bfe0ff');

  // таймер / убийства
  txt(Math.floor(gameTime / 60) + ':' + String(Math.floor(gameTime % 60)).padStart(2, '0'), W - 22, by + 8, 20, '#eaf2ff', 'right');
  txt('убито: ' + kills, W - 22, by + 30, 12, '#8fa4c8', 'right');
  const dtxt = 'оружие: ' + Math.ceil(dropTimer) + ' с';
  txt(dtxt, W - 22, by + 50, 12, dropTimer < 8 ? '#ffd166' : '#8fa4c8', 'right');
  txt(Music.on ? '♪ музыка вкл' : '♪ музыка выкл', W - 22, by + 68, 11, Music.on ? '#7ef0c0' : '#6b7a9c', 'right');

  // полоса босса
  if (bossRef && !bossRef.dead) {
    const w = Math.min(560, W - 120), x = (W - w) / 2, y = 26;
    ctx.fillStyle = 'rgba(10,14,26,0.75)';
    rr(x, y, w, 14, 7); ctx.fill();
    const k = clamp(bossRef.hp / bossRef.maxHp, 0, 1);
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#ff2d6f');
    g.addColorStop(1, '#ff8a5c');
    ctx.fillStyle = g;
    rr(x, y, Math.max(4, w * k), 14, 7); ctx.fill();
    txt('МИНИ-БОСС ' + bossTier, W / 2, y + 34, 12, '#ff8ab0', 'center');
  }

  // суперудар
  const sw = 300, swx = (W - sw) / 2, swy = H - 52;
  ctx.fillStyle = 'rgba(10,14,26,0.72)';
  rr(swx, swy, sw, 14, 7); ctx.fill();
  const sk = P.superCd > 0 ? 1 - P.superCd / P.superMax : 1;
  const sg = ctx.createLinearGradient(swx, 0, swx + sw, 0);
  sg.addColorStop(0, '#8a5cff');
  sg.addColorStop(1, '#c8a0ff');
  ctx.fillStyle = sg;
  rr(swx, swy, Math.max(4, sw * sk), 14, 7); ctx.fill();
  if (P.superCd <= 0) {
    const pul = 0.6 + 0.4 * Math.sin(performance.now() / 180);
    ctx.globalAlpha = pul;
    txt('ПРОБЕЛ — СУПЕРУДАР ГОТОВ', W / 2, swy + 7, 12, '#ffffff', 'center');
    ctx.globalAlpha = 1;
  } else {
    txt('СУПЕРУДАР: ' + Math.ceil(P.superCd) + ' с', W / 2, swy + 7, 11, '#c9b8ff', 'center');
  }

  // оружие в слотах
  let ix = 22, iy = H - 40;
  for (const w of P.weapons) {
    ctx.fillStyle = 'rgba(10,14,26,0.8)';
    rr(ix, iy, 34, 34, 8); ctx.fill();
    ctx.strokeStyle = hexA(w.def.color, 0.85);
    ctx.lineWidth = 2;
    rr(ix, iy, 34, 34, 8); ctx.stroke();
    ctx.fillStyle = w.def.color;
    ctx.beginPath(); ctx.arc(ix + 17, iy + 17, 8, 0, TAU); ctx.fill();
    if (w.stack > 1) txt('×' + w.stack, ix + 30, iy + 6, 10, '#fff', 'right');
    ix += 40;
  }

  // указатель на упавшее оружие за экраном
  for (const p of pickups) {
    if (p.kind !== 'weapon') continue;
    const sx2 = p.x - cam.x, sy2 = p.y - cam.y;
    if (sx2 > 20 && sx2 < W - 20 && sy2 > 20 && sy2 < H - 20) continue;
    const cx = clamp(sx2, 46, W - 46), cy = clamp(sy2, 90, H - 90);
    const a = Math.atan2(sy2 - H / 2, sx2 - W / 2);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a);
    ctx.fillStyle = hexA(p.def.color, 0.9);
    ctx.beginPath();
    ctx.moveTo(12, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/* =========================================================
   ЭКРАНЫ
   ========================================================= */
function panel(w, h) {
  ctx.fillStyle = 'rgba(4,6,16,0.82)';
  ctx.fillRect(0, 0, W, H);
  const x = (W - w) / 2, y = (H - h) / 2;
  ctx.fillStyle = 'rgba(12,16,32,0.94)';
  rr(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(120,200,255,0.28)';
  ctx.lineWidth = 1.5;
  rr(x, y, w, h, 16); ctx.stroke();
  return { x, y };
}

function drawOverlays() {
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(4,6,16,0.55)';
    ctx.fillRect(0, 0, W, H);
    const cy = H / 2;
    ctx.save();
    ctx.shadowColor = '#6ad8ff';
    ctx.shadowBlur = 26;
    txt('НЕОН', W / 2, cy - 78, 68, '#dff4ff', 'center');
    ctx.shadowColor = '#c8a0ff';
    txt('ВЫЖИВАНИЕ', W / 2, cy - 16, 46, '#c8a0ff', 'center');
    ctx.restore();
    txt('55 видов оружия · боссы · сверхновая', W / 2, cy + 34, 14, '#8fa4c8', 'center');
    const pul = 0.55 + 0.45 * Math.sin(performance.now() / 320);
    ctx.globalAlpha = pul;
    txt('ENTER — НАЧАТЬ', W / 2, cy + 84, 20, '#7ef0c0', 'center');
    ctx.globalAlpha = 1;
    txt('WASD — движение · ПРОБЕЛ — суперудар · ESC/P — пауза · M — музыка', W / 2, cy + 126, 12, '#6b7a9c', 'center');
    txt('каждые 45 секунд рядом падает ящик с новым оружием', W / 2, cy + 150, 12, '#5d6b8c', 'center');
  }

  if (state === 'paused') {
    const w = 440, h = 330, p = panel(w, h);
    txt('ПАУЗА', W / 2, p.y + 44, 30, '#dff4ff', 'center');
    txt('время: ' + Math.floor(gameTime) + ' с · убито: ' + kills + ' · уровень: ' + level, W / 2, p.y + 86, 13, '#8fa4c8', 'center');
    txt('оружие: ' + (P.weapons.length ? P.weapons.map(w2 => w2.def.name).join(', ') : 'только бластер'), W / 2, p.y + 118, 12, '#7ef0c0', 'center');
    txt('суперудар: ' + (P.superCd > 0 ? Math.ceil(P.superCd) + ' с' : 'готов'), W / 2, p.y + 146, 12, '#c8a0ff', 'center');
    txt('ESC / P — продолжить', W / 2, p.y + 200, 15, '#eaf2ff', 'center');
    txt('R — начать заново', W / 2, p.y + 232, 15, '#ffb0c0', 'center');
    txt('M — музыка ' + (Music.on ? 'выкл' : 'вкл'), W / 2, p.y + 264, 13, '#8fa4c8', 'center');
  }

  if (state === 'upgrade') {
    const w = Math.min(720, W - 60), h = 330, p = panel(w, h);
    txt('НОВЫЙ УРОВЕНЬ ' + level, W / 2, p.y + 40, 24, '#7ef0c0', 'center');
    txt('выбери улучшение — клавиши 1 / 2 / 3', W / 2, p.y + 72, 13, '#8fa4c8', 'center');
    const cw = (w - 80) / 3;
    for (let i = 0; i < cards.length; i++) {
      const cx = p.x + 26 + i * (cw + 14);
      const cy = p.y + 100;
      ctx.fillStyle = 'rgba(20,28,48,0.95)';
      rr(cx, cy, cw, 180, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(126,240,192,0.5)';
      ctx.lineWidth = 1.5;
      rr(cx, cy, cw, 180, 12); ctx.stroke();
      txt(String(i + 1), cx + cw / 2, cy + 26, 20, '#7ef0c0', 'center');
      const words = cards[i].name.split(' ');
      let line = '', ly = cy + 66;
      ctx.font = '700 15px system-ui,sans-serif';
      for (const wd of words) {
        if ((line + ' ' + wd).length > 16) {
          txt(line, cx + cw / 2, ly, 15, '#eaf2ff', 'center');
          line = wd; ly += 20;
        } else line = line ? line + ' ' + wd : wd;
      }
      if (line) txt(line, cx + cw / 2, ly, 15, '#eaf2ff', 'center');
      const dwords = cards[i].desc.split(' ');
      let dl = '', dly = ly + 34;
      ctx.font = '400 12px system-ui,sans-serif';
      for (const wd of dwords) {
        if ((dl + ' ' + wd).length > 22) {
          txt(dl, cx + cw / 2, dly, 12, '#8fa4c8', 'center');
          dl = wd; dly += 16;
        } else dl = dl ? dl + ' ' + wd : wd;
      }
      if (dl) txt(dl, cx + cw / 2, dly, 12, '#8fa4c8', 'center');
    }
  }

  if (state === 'weapon') {
    const w = Math.min(760, W - 60), h = 320, p = panel(w, h);
    txt('ЯЩИК С ОРУЖИЕМ', W / 2, p.y + 38, 24, '#ffd166', 'center');
    txt('выбери ствол — клавиши 1 / 2 / 3 · он останется навсегда', W / 2, p.y + 70, 13, '#8fa4c8', 'center');
    const cw = (w - 80) / 3;
    for (let i = 0; i < weaponCards.length; i++) {
      const d = weaponCards[i];
      const cx = p.x + 26 + i * (cw + 14);
      const cy = p.y + 98;
      ctx.fillStyle = 'rgba(20,28,48,0.95)';
      rr(cx, cy, cw, 180, 12); ctx.fill();
      ctx.strokeStyle = hexA(d.color, 0.6);
      ctx.lineWidth = 1.5;
      rr(cx, cy, cw, 180, 12); ctx.stroke();
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      glowCircle(cx + cw / 2, cy + 44, 34, d.color, 0.5);
      ctx.restore();
      ctx.fillStyle = d.color;
      ctx.beginPath(); ctx.arc(cx + cw / 2, cy + 44, 12, 0, TAU); ctx.fill();
      txt(d.name, cx + cw / 2, cy + 92, 14, '#eaf2ff', 'center');
      txt(d.grp + ' · ' + d.dmg + ' урона', cx + cw / 2, cy + 118, 12, '#8fa4c8', 'center');
      txt(String(i + 1), cx + cw / 2, cy + 156, 16, d.color, 'center');
    }
  }

  if (state === 'dead') {
    const w = Math.min(520, W - 60), h = 300, p = panel(w, h);
    txt('ТЫ ПАЛ', W / 2, p.y + 46, 32, '#ff6b8a', 'center');
    txt('продержался ' + Math.floor(gameTime) + ' с', W / 2, p.y + 94, 18, '#eaf2ff', 'center');
    txt('убито врагов: ' + kills + ' · уровень: ' + level + ' · боссов: ' + bossTier, W / 2, p.y + 128, 13, '#8fa4c8', 'center');
    txt('оружия собрано: ' + P.weapons.length, W / 2, p.y + 152, 13, '#8fa4c8', 'center');
    const pul = 0.55 + 0.45 * Math.sin(performance.now() / 300);
    ctx.globalAlpha = pul;
    txt('ENTER — ещё раз', W / 2, p.y + 212, 19, '#7ef0c0', 'center');
    ctx.globalAlpha = 1;
  }
}

/* =========================================================
   ВВОД
   ========================================================= */
addEventListener('keydown', e => {
  const c = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();

  if (c === 'KeyM') { Music.toggle(); return; }

  if (c === 'Enter' || c === 'NumpadEnter') {
    if (state === 'menu' || state === 'dead') {
      resetGame();
      state = 'playing';
      Music.init();
    }
    return;
  }

  if (state === 'playing' || state === 'paused') {
    if (c === 'Escape' || c === 'KeyP') {
      state = state === 'playing' ? 'paused' : 'playing';
      return;
    }
    if (state === 'paused' && c === 'KeyR') {
      resetGame();
      state = 'playing';
      return;
    }
  }

  if (state === 'playing' && c === 'Space') { useSuper(); return; }

  if (state === 'upgrade') {
    if (c === 'Digit1' || c === 'Numpad1') chooseUpgrade(0);
    else if (c === 'Digit2' || c === 'Numpad2') chooseUpgrade(1);
    else if (c === 'Digit3' || c === 'Numpad3') chooseUpgrade(2);
    return;
  }
  if (state === 'weapon') {
    if (c === 'Digit1' || c === 'Numpad1') chooseWeapon(0);
    else if (c === 'Digit2' || c === 'Numpad2') chooseWeapon(1);
    else if (c === 'Digit3' || c === 'Numpad3') chooseWeapon(2);
    return;
  }

  keys.add(c);
});

addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

/* =========================================================
   ЦИКЛ
   ========================================================= */
let lastT = performance.now();

function loop(now) {
  let raw = (now - lastT) / 1000;
  lastT = now;
  if (!isFinite(raw) || raw < 0) raw = 0;
  raw = Math.min(raw, 0.05);

  updateBg(raw);

  if (state === 'playing') {
    let dt = raw;
    if (hitstop > 0) { hitstop -= raw; dt *= 0.22; }
    step(dt);
  }

  render();
  requestAnimationFrame(loop);
}

resetGame();
state = 'menu';
resize();
requestAnimationFrame(loop);
</script>
