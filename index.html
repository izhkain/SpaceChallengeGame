<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>НЕОН-ВЫЖИВАНИЕ</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#05060c; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
'use strict';

// ============================================================
//  БАЗА
// ============================================================
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;
var FONT = "'Segoe UI', system-ui, -apple-system, Roboto, sans-serif";
var TAU = Math.PI * 2;

function rand(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function dist2(ax, ay, bx, by){ var dx = ax-bx, dy = ay-by; return dx*dx + dy*dy; }
function hexA(hex, a){
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}
function rr(x, y, w, h, r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
function poly(x, y, r, n, rot){
  ctx.beginPath();
  for(var i=0;i<n;i++){
    var a = rot + i*(TAU/n);
    var px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
function wrapText(text, maxW, font){
  ctx.font = font;
  var words = String(text).split(' ');
  var lines = [], line = '';
  for(var i=0;i<words.length;i++){
    var test = line ? line + ' ' + words[i] : words[i];
    if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = words[i]; }
    else line = test;
  }
  if(line) lines.push(line);
  return lines;
}
function fmtTime(t){
  var m = Math.floor(t/60), s = Math.floor(t%60);
  return (m<10?'0':'') + m + ':' + (s<10?'0':'') + s;
}

// ============================================================
//  КОНСТАНТЫ
// ============================================================
var SUPER_CD   = 30;   // перезарядка суперудара, сек
var BOSS_FIRST = 40;   // через сколько секунд приходит первый мини-босс
var BOSS_EVERY = 55;   // интервал между мини-боссами

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
var state = 'menu';
var player = null;
var enemies = [], bullets = [], ebullets = [], orbs = [], parts = [], texts = [], rings = [], bolts = [], pickups = [];
var boss = null;
var cam = { x:0, y:0 };
var time = 0;
var clock = 0;
var superCd = 0;
var spawnTimer = 0;
var bossTimer = 0;
var bossTier = 0;
var shake = 0;
var timeScale = 1;
var hitStop = 0;
var killCount = 0;
var pendingLevels = 0;
var upgradeChoices = null;
var weaponChoices = null;

var stars = [], nebulas = [];

var best = 0;
try { best = parseFloat(localStorage.getItem('neon_best') || '0') || 0; } catch(e){ best = 0; }
function saveBest(){
  if(time > best){
    best = time;
    try { localStorage.setItem('neon_best', String(best)); } catch(e){}
  }
}

// ============================================================
//  РАЗМЕР ЭКРАНА + ФОН
// ============================================================
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  buildBackground();
}
window.addEventListener('resize', resize);

function buildBackground(){
  stars = [];
  var count = Math.floor((W*H)/2600);
  if(count > 900) count = 900;
  for(var i=0;i<count;i++){
    var layer = Math.random();
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: 0.4 + Math.random()*1.6,
      p: 0.05 + layer*0.55,
      tw: Math.random()*TAU,
      tws: 0.5 + Math.random()*2.4,
      hue: Math.random() < 0.22 ? (Math.random()<0.5 ? 205 : 320) : 190
    });
  }
  nebulas = [];
  var pal = ['#7b3cff','#ff3cae','#0fd8ff','#5b2bd6','#ff5ea8','#1b8cff','#a44bff'];
  for(var j=0;j<7;j++){
    nebulas.push({
      x: Math.random(), y: Math.random(),
      r: Math.min(W,H) * rand(0.38, 0.85),
      col: pal[j % pal.length],
      a: rand(0.09, 0.20),
      dx: rand(-0.006, 0.006),
      dy: rand(-0.006, 0.006),
      ph: Math.random()*TAU
    });
  }
}

function updateStars(raw){
  for(var i=0;i<stars.length;i++) stars[i].tw += stars[i].tws * raw;
  for(var j=0;j<nebulas.length;j++){
    var n = nebulas[j];
    n.x += n.dx * raw;
    n.y += n.dy * raw;
    if(n.x < -0.2) n.x = 1.2;
    if(n.x > 1.2) n.x = -0.2;
    if(n.y < -0.2) n.y = 1.2;
    if(n.y > 1.2) n.y = -0.2;
  }
}

function drawBackground(){
  ctx.fillStyle = '#05060c';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for(var j=0;j<nebulas.length;j++){
    var n = nebulas[j];
    var px = n.x*W, py = n.y*H;
    var a = n.a * (0.75 + 0.25*Math.sin(clock*0.45 + n.ph));
    var g = ctx.createRadialGradient(px, py, 0, px, py, n.r);
    g.addColorStop(0,    hexA(n.col, a));
    g.addColorStop(0.45, hexA(n.col, a*0.42));
    g.addColorStop(1,    hexA(n.col, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, n.r, 0, TAU); ctx.fill();
  }

  for(var i=0;i<stars.length;i++){
    var s = stars[i];
    var sx = ((s.x*W - cam.x*s.p) % W + W) % W;
    var sy = ((s.y*H - cam.y*s.p) % H + H) % H;
    var al = 0.25 + 0.75*Math.abs(Math.sin(s.tw));
    ctx.fillStyle = 'hsla(' + s.hue + ',100%,80%,' + al + ')';
    ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, TAU); ctx.fill();
    if(s.r > 1.35){
      ctx.fillStyle = 'hsla(' + s.hue + ',100%,92%,' + (al*0.35) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, s.r*2.6, 0, TAU); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawVignette(){
  var g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.25, W/2, H/2, Math.max(W,H)*0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ============================================================
//  ВВОД
// ============================================================
var keys = {};
window.addEventListener('keydown', function(e){
  var c = e.code;
  if(c==='Space' || c==='ArrowUp' || c==='ArrowDown' || c==='ArrowLeft' || c==='ArrowRight') e.preventDefault();
  keys[c] = true;

  if(c==='Enter'){
    if(state==='menu' || state==='dead') startGame();
    return;
  }
  if(c==='KeyP' || c==='Escape'){ togglePause(); return; }
  if(c==='KeyR'){
    if(state==='dead' || state==='paused') startGame();
    return;
  }
  if(c==='Space' && state==='playing'){ useSuper(); return; }

  var num = -1;
  if(c==='Digit1' || c==='Numpad1') num = 0;
  if(c==='Digit2' || c==='Numpad2') num = 1;
  if(c==='Digit3' || c==='Numpad3') num = 2;

  if(num >= 0){
    if(state==='upgrade'){ pickUpgrade(num); return; }
    if(state==='weapon'){ pickWeapon(num); return; }
  }
}, { passive:false });

window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ keys = {}; });

function togglePause(){
  if(state==='playing') state = 'paused';
  else if(state==='paused') state = 'playing';
}

// ============================================================
//  СТАРТ ИГРЫ
// ============================================================
function startGame(){
  player = {
    x:0, y:0, r:15,
    hp:100, maxhp:100,
    dmg:12, fireRate:0.40, cd:0,
    bulletSpeed:620, multishot:1, pierce:0,
    speed:235, magnetR:120,
    crit:0, critMul:2,
    lvl:1, xp:0, xpNext:8,
    weapons:[], invuln:0.8
  };
  enemies=[]; bullets=[]; ebullets=[]; orbs=[]; parts=[]; texts=[]; rings=[]; bolts=[]; pickups=[];
  boss = null;
  cam.x = 0; cam.y = 0;
  time = 0; superCd = 0; spawnTimer = 0.6; bossTimer = 0; bossTier = 0;
  shake = 0; timeScale = 1; hitStop = 0; killCount = 0;
  pendingLevels = 0; upgradeChoices = null; weaponChoices = null;
  state = 'playing';
}

// ============================================================
//  ЭФФЕКТЫ
// ============================================================
function spawnParticles(x, y, count, color, speed, size, life){
  for(var i=0;i<count;i++){
    if(parts.length > 950) break;
    var a = rand(0, TAU);
    var sp = rand(speed*0.25, speed);
    parts.push({
      x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      r:rand(size*0.5, size),
      color:color,
      life:rand(life*0.6, life),
      max:life
    });
  }
}
function addText(x, y, txt, color, size){
  if(texts.length > 70) texts.shift();
  texts.push({ x:x, y:y, vy:-46, life:0.85, max:0.85, text:txt, color:color, size:size||14 });
}

function updateParticles(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.life -= dt;
    if(p.life <= 0){ parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    var k = Math.pow(0.12, dt);
    p.vx *= k; p.vy *= k;
  }
}
function updateTexts(dt){
  for(var i=texts.length-1;i>=0;i--){
    var t = texts[i];
    t.life -= dt;
    if(t.life <= 0){ texts.splice(i,1); continue; }
    t.y += t.vy*dt;
    t.vy *= Math.pow(0.25, dt);
  }
}

// ============================================================
//  ВРАГИ
// ============================================================
function nearestEnemy(x, y, maxD){
  var bestE = null, bd = maxD*maxD;
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead) continue;
    var d = dist2(x, y, e.x, e.y);
    if(d < bd){ bd = d; bestE = e; }
  }
  return bestE;
}

function spawnWave(){
  var n = 1 + Math.floor(time/22);
  if(n > 5) n = 5;
  for(var i=0;i<n;i++) spawnEnemy();
}

function spawnEnemy(){
  if(enemies.length > 230) return;
  var roll = Math.random();
  var type = 'slime';
  if(time > 25 && roll > 0.72) type = 'runner';
  if(time > 55 && roll > 0.90) type = 'brute';

  var ang = rand(0, TAU);
  var rad = Math.max(W,H)*0.62 + rand(0, 180);
  var hpScale = 1 + time*0.014;
  var spScale = 1 + Math.min(0.75, time*0.0022);

  var e = {
    x: cam.x + Math.cos(ang)*rad,
    y: cam.y + Math.sin(ang)*rad,
    kx:0, ky:0, hitFlash:0, dead:false, isBoss:false,
    seed: rand(0,TAU), spin:0, type:type
  };

  if(type === 'runner'){
    e.r = 11; e.hp = 14*hpScale; e.speed = 152*spScale; e.dmg = 7;  e.color = '#ff7ad9'; e.xp = 1;
  } else if(type === 'brute'){
    e.r = 24; e.hp = 82*hpScale; e.speed = 52*spScale;  e.dmg = 17; e.color = '#ffa14a'; e.xp = 3;
  } else {
    e.r = 14; e.hp = 20*hpScale; e.speed = 72*spScale;  e.dmg = 9;  e.color = '#5df2a8'; e.xp = 1;
  }
  e.maxhp = e.hp;
  enemies.push(e);
}

function spawnBoss(){
  bossTier++;
  var ang = rand(0, TAU);
  var rad = Math.max(W,H)*0.60;
  var hp = 620 + bossTier*560;
  var b = {
    x: cam.x + Math.cos(ang)*rad,
    y: cam.y + Math.sin(ang)*rad,
    r: 48 + bossTier*3,
    hp: hp, maxhp: hp,
    speed: 46 + bossTier*5,
    dmg: 24 + bossTier*4,
    color: '#ff5ea8',
    kx:0, ky:0, hitFlash:0, dead:false,
    isBoss: true, tier: bossTier, seed: rand(0,TAU), spin:0,
    shootT: 2.0, chargeT: 6.0, charging: false, chargeTime: 0, cvx:0, cvy:0
  };
  enemies.push(b);
  boss = b;
  shake = 16;
  addText(b.x, b.y - 70, 'МИНИ-БОСС', '#ff5ea8', 24);
}

function updateBoss(b, dt){
  b.spin += dt*0.9;
  b.hitFlash = Math.max(0, b.hitFlash - dt);

  var dx = player.x - b.x, dy = player.y - b.y;
  var d = Math.hypot(dx, dy) || 1;

  if(b.charging){
    b.chargeTime -= dt;
    b.x += b.cvx*dt;
    b.y += b.cvy*dt;
    if(b.chargeTime <= 0) b.charging = false;
  } else {
    b.x += (dx/d) * b.speed * dt;
    b.y += (dy/d) * b.speed * dt;

    b.chargeT -= dt;
    if(b.chargeT <= 0){
      b.chargeT = 6.5;
      b.charging = true;
      b.chargeTime = 0.42;
      var a0 = Math.atan2(dy, dx);
      b.cvx = Math.cos(a0)*780;
      b.cvy = Math.sin(a0)*780;
      shake = Math.max(shake, 10);
      spawnParticles(b.x, b.y, 20, '#ff5ea8', 260, 5, 0.4);
    }
  }

  b.shootT -= dt;
  if(b.shootT <= 0){
    b.shootT = Math.max(1.15, 2.6 - b.tier*0.16);
    var n = 8 + b.tier*2;
    var off = Math.random()*TAU;
    for(var i=0;i<n;i++){
      var a = off + i*(TAU/n);
      ebullets.push({
        x:b.x, y:b.y,
        vx:Math.cos(a)*215, vy:Math.sin(a)*215,
        r:7, dmg:10 + b.tier*2, life:4.5, color:'#ff5ea8'
      });
    }
    shake = Math.max(shake, 6);
  }
}

function damageEnemy(e, dmg, hx, hy, crit){
  if(e.dead) return;
  e.hp -= dmg;
  e.hitFlash = 0.12;
  if(crit) addText(hx, hy-10, Math.round(dmg) + '!', '#ffe066', 17);
  spawnParticles(hx, hy, crit ? 7 : 3, e.color, 130, 2.6, 0.32);
  if(e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  e.dead = true;
  killCount++;

  if(e.isBoss){
    spawnParticles(e.x, e.y, 100, '#ff5ea8', 640, 7, 1.2);
    spawnParticles(e.x, e.y, 50, '#ffffff', 420, 4, 0.7);
    shake = 32;
    ebullets.length = 0;
    for(var i=0;i<14;i++) spawnOrb(e.x + rand(-70,70), e.y + rand(-70,70), 5);
    pickups.push({ x:e.x, y:e.y, r:28, t:0 });
    addText(e.x, e.y-60, 'ОРУЖИЕ!', '#ffe066', 26);
    boss = null;
  } else {
    spawnParticles(e.x, e.y, 9, e.color, 190, 3, 0.45);
    spawnOrb(e.x, e.y, e.xp);
  }
}

// ============================================================
//  ОПЫТ
// ============================================================
function spawnOrb(x, y, val){
  if(orbs.length > 420) return;
  orbs.push({ x:x, y:y, v:val, r:5, t:rand(0,TAU) });
}

function gainXp(v){
  player.xp += v;
  checkLevel();
}

function checkLevel(){
  while(player.xp >= player.xpNext){
    player.xp -= player.xpNext;
    player.lvl++;
    player.xpNext = Math.floor(8 * Math.pow(1.28, player.lvl-1));
    pendingLevels++;
  }
  if(pendingLevels > 0 && state === 'playing') openUpgrades();
}

// ============================================================
//  УЛУЧШЕНИЯ
// ============================================================
var UPGRADES = [
  { name:'Урон +25%',        desc:'Каждая пуля бьёт сильнее',         color:'#ff7a7a', apply:function(){ player.dmg *= 1.25; } },
  { name:'Скорострельность', desc:'Стреляешь на 18% чаще',            color:'#7ad7ff', apply:function(){ player.fireRate = Math.max(0.09, player.fireRate*0.82); } },
  { name:'+1 пуля',          desc:'Веер шире на один снаряд',         color:'#a8ff7a', apply:function(){ player.multishot += 1; } },
  { name:'Пробивание',       desc:'Пули проходят сквозь +1 врага',    color:'#c2a8ff', apply:function(){ player.pierce += 1; } },
  { name:'Скорость',         desc:'Двигаешься на 12% быстрее',        color:'#7affd7', apply:function(){ player.speed *= 1.12; } },
  { name:'Живучесть',        desc:'+30 к максимуму HP и лечит на 30', color:'#5df2a8', apply:function(){ player.maxhp += 30; player.hp = Math.min(player.maxhp, player.hp+30); } },
  { name:'Магнит',           desc:'Сферы опыта притягиваются дальше', color:'#ffd35c', apply:function(){ player.magnetR *= 1.5; } },
  { name:'Критический',      desc:'+12% шанс крита (урон x2)',        color:'#ff5ea8', apply:function(){ player.crit = Math.min(0.75, player.crit + 0.12); } },
  { name:'Скорость пуль',    desc:'Снаряды летят на 25% быстрее',     color:'#9ecbff', apply:function(){ player.bulletSpeed *= 1.25; } },
  { name:'Лечение',          desc:'Восстанавливает 40 HP',            color:'#5df2a8', apply:function(){ player.hp = Math.min(player.maxhp, player.hp+40); } }
];

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function openUpgrades(){
  upgradeChoices = shuffle(UPGRADES.slice()).slice(0, 3);
  state = 'upgrade';
}

function pickUpgrade(i){
  if(state !== 'upgrade' || !upgradeChoices) return;
  var u = upgradeChoices[i];
  if(!u) return;
  u.apply();
  upgradeChoices = null;
  state = 'playing';
  pendingLevels = Math.max(0, pendingLevels - 1);
  if(pendingLevels > 0) openUpgrades();
  else checkLevel();
}

// ============================================================
//  ОРУЖИЕ (дроп с мини-босса)
// ============================================================
function wdmg(base){ return base + player.dmg * 0.6; }

var WEAPONS = [
  {
    id:'plasma', name:'Плазменный резак',
    desc:'Тяжёлый луч, прошивает 3 врага насквозь',
    color:'#7dffb0', cd:0.50,
    fire:function(p){
      var t = nearestEnemy(p.x, p.y, 1200);
      if(!t) return false;
      var a = Math.atan2(t.y-p.y, t.x-p.x);
      spawnBullet(p.x, p.y, a, wdmg(30), 6, '#7dffb0', 3, { speed:1000, life:1.4 });
      return true;
    }
  },
  {
    id:'rocket', name:'Ракетница',
    desc:'Самонаводящаяся ракета со взрывом по площади',
    color:'#ffb35c', cd:1.45,
    fire:function(p){
      var t = nearestEnemy(p.x, p.y, 1300);
      if(!t) return false;
      var a = Math.atan2(t.y-p.y, t.x-p.x);
      spawnBullet(p.x, p.y, a, wdmg(55), 8, '#ffb35c', 0, { speed:430, homing:2.4, explode:85, life:3 });
      return true;
    }
  },
  {
    id:'tesla', name:'Тесла-дуга',
    desc:'Молния перескакивает по 5 врагам',
    color:'#9ecbff', cd:1.05,
    fire:function(p){
      var cur = nearestEnemy(p.x, p.y, 560);
      if(!cur) return false;
      var pts = [[p.x, p.y]];
      var used = [];
      var dmg = wdmg(26);
      for(var i=0;i<5 && cur;i++){
        used.push(cur);
        pts.push([cur.x, cur.y]);
        damageEnemy(cur, dmg, cur.x, cur.y, false);
        dmg *= 0.85;
        var bestE = null, bd = 240*240;
        for(var k=0;k<enemies.length;k++){
          var e2 = enemies[k];
          if(e2.dead) continue;
          if(used.indexOf(e2) !== -1) continue;
          var dd = dist2(e2.x, e2.y, cur.x, cur.y);
          if(dd < bd){ bd = dd; bestE = e2; }
        }
        cur = bestE;
      }
      bolts.push({ pts:pts, life:0.2, max:0.2 });
      return true;
    }
  },
  {
    id:'shotgun', name:'Импульсный дробовик',
    desc:'6 дробин веером — в упор сносит всё',
    color:'#ffe066', cd:0.85,
    fire:function(p){
      var t = nearestEnemy(p.x, p.y, 950);
      if(!t) return false;
      var base = Math.atan2(t.y-p.y, t.x-p.x);
      for(var i=0;i<6;i++){
        spawnBullet(p.x, p.y, base + rand(-0.3, 0.3), wdmg(15), 5, '#ffe066', 0, { speed:820, life:0.5 });
      }
      return true;
    }
  },
  {
    id:'drones', name:'Орбитальные дроны',
    desc:'+2 дрона кружат рядом и стреляют сами',
    color:'#c9a8ff', cd:0.70,
    fire:function(p){
      var pos = dronePositions();
      if(!pos.length) return false;
      var t = nearestEnemy(p.x, p.y, 950);
      if(!t) return false;
      for(var i=0;i<pos.length;i++){
        var a = Math.atan2(t.y-pos[i][1], t.x-pos[i][0]);
        spawnBullet(pos[i][0], pos[i][1], a, wdmg(14), 4.5, '#c9a8ff', 0, { speed:780, life:1.4 });
      }
      return true;
    }
  }
];

var WEAPON_BY_ID = {};
for(var wi=0; wi<WEAPONS.length; wi++) WEAPON_BY_ID[WEAPONS[wi].id] = WEAPONS[wi];

function dronePositions(){
  var out = [];
  if(!player) return out;
  var slots = 0;
  for(var i=0;i<player.weapons.length;i++) if(player.weapons[i].id === 'drones') slots++;
  var n = slots * 2;
  if(!n) return out;
  for(var k=0;k<n;k++){
    var a = time*1.9 + k*(TAU/n);
    out.push([player.x + Math.cos(a)*64, player.y + Math.sin(a)*64]);
  }
  return out;
}

function openWeaponChoice(){
  weaponChoices = shuffle(WEAPONS.slice()).slice(0, 3);
  state = 'weapon';
  player.hp = Math.min(player.maxhp, player.hp + 30);
}

function pickWeapon(i){
  if(state !== 'weapon' || !weaponChoices) return;
  var def = weaponChoices[i];
  if(!def) return;
  player.weapons.push({ id:def.id, t:0.25 });
  if(player.weapons.length > 4) player.weapons.shift();
  addText(player.x, player.y - 60, def.name.toUpperCase(), def.color, 20);
  spawnParticles(player.x, player.y, 26, def.color, 320, 4, 0.6);
  weaponChoices = null;
  state = 'playing';
}

// ============================================================
//  ПУЛИ
// ============================================================
function spawnBullet(x, y, ang, dmg, r, color, pierce, opt){
  opt = opt || {};
  var sp = opt.speed || player.bulletSpeed;
  bullets.push({
    x:x, y:y,
    vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
    r:r, dmg:dmg, color:color,
    pierce: pierce || 0,
    life: opt.life || 1.6,
    hit: [],
    homing: opt.homing || 0,
    explode: opt.explode || 0,
    dead: false
  });
}

function explode(x, y, radius, dmg){
  rings.push({ x:x, y:y, r:8, maxR:radius, speed:radius*7, dmg:dmg, hits:[], color:'#ffb35c', width:6 });
  spawnParticles(x, y, 16, '#ffb35c', 300, 4, 0.5);
  shake = Math.max(shake, 6);
}

// ============================================================
//  СУПЕРУДАР
// ============================================================
function useSuper(){
  if(state !== 'playing' || superCd > 0) return;
  superCd = SUPER_CD;
  rings.push({
    x:player.x, y:player.y, r:20, maxR:820, speed:1550,
    dmg: 140 + player.dmg*6, hits:[], color:'#b58bff', width:16
  });
  hitStop = 0.14;
  shake = 22;
  spawnParticles(player.x, player.y, 80, '#b58bff', 640, 6, 0.9);
  spawnParticles(player.x, player.y, 40, '#ffffff', 430, 4, 0.6);
  addText(player.x, player.y - 55, 'СВЕРХНОВАЯ', '#d9c2ff', 26);
}

// ============================================================
//  ОБНОВЛЕНИЕ МИРА
// ============================================================
function updateWorld(dt){

  time += dt;

  if(superCd > 0) superCd = Math.max(0, superCd - dt);
  if(player.invuln > 0) player.invuln -= dt;

  var mx = 0, my = 0;
  if(keys.KeyA || keys.ArrowLeft)  mx--;
  if(keys.KeyD || keys.ArrowRight) mx++;
  if(keys.KeyW || keys.ArrowUp)    my--;
  if(keys.KeyS || keys.ArrowDown)  my++;
  if(mx || my){
    var l = Math.hypot(mx,my);
    mx /= l; my /= l;
  }
  player.x += mx * player.speed * dt;
  player.y += my * player.speed * dt;

  cam.x += (player.x - cam.x) * Math.min(1, dt*11);
  cam.y += (player.y - cam.y) * Math.min(1, dt*11);

  // --- базовое оружие ---
  player.cd -= dt;
  if(player.cd <= 0){
    var tgt = nearestEnemy(player.x, player.y, 1000);
    if(tgt){
      player.cd = player.fireRate;
      var base = Math.atan2(tgt.y-player.y, tgt.x-player.x);
      var n = player.multishot;
      for(var i=0;i<n;i++){
        var off = (i - (n-1)/2) * 0.13;
        spawnBullet(player.x, player.y, base+off, player.dmg, 4.5, '#8ef7ff', player.pierce, {});
      }
    } else {
      player.cd = 0.1;
    }
  }

  // --- доп. оружие ---
  for(var w=0; w<player.weapons.length; w++){
    var wp = player.weapons[w];
    wp.t -= dt;
    if(wp.t > 0) continue;
    var def = WEAPON_BY_ID[wp.id];
    if(!def){ wp.t = 1; continue; }
    wp.t = def.fire(player) ? def.cd : 0.1;
  }

  // --- спавн врагов ---
  spawnTimer -= dt;
  if(spawnTimer <= 0){
    var interval = Math.max(0.22, 0.95 - time*0.007);
    spawnTimer = interval * rand(0.7, 1.35);
    spawnWave();
  }

  // --- мини-босс ---
  if(!boss){
    bossTimer += dt;
    var need = (bossTier === 0) ? BOSS_FIRST : BOSS_EVERY;
    if(bossTimer >= need){ bossTimer = 0; spawnBoss(); }
  }

  // --- враги ---
  for(var ei=0; ei<enemies.length; ei++){
    var e = enemies[ei];
    if(e.dead) continue;
    e.hitFlash = Math.max(0, e.hitFlash - dt);

    if(e.isBoss){
      updateBoss(e, dt);
    } else {
      var dx = player.x - e.x, dy = player.y - e.y;
      var d = Math.hypot(dx, dy) || 1;
      e.x += (dx/d) * e.speed * dt;
      e.y += (dy/d) * e.speed * dt;
    }

    e.x += e.kx * dt;
    e.y += e.ky * dt;
    var kk = Math.pow(0.0025, dt);
    e.kx *= kk; e.ky *= kk;

    var rr2 = e.r + player.r;
    if(dist2(e.x, e.y, player.x, player.y) < rr2*rr2){
      hurtPlayer(e.dmg);
      var a2 = Math.atan2(e.y-player.y, e.x-player.x);
      e.kx = Math.cos(a2)*220;
      e.ky = Math.sin(a2)*220;
    }
  }
  enemies = enemies.filter(function(x){ return !x.dead; });

  // --- пули игрока ---
  for(var bi=0; bi<bullets.length; bi++){
    var b = bullets[bi];
    if(b.dead) continue;
    b.life -= dt;

    if(b.homing){
      var ht = nearestEnemy(b.x, b.y, 700);
      if(ht){
        var want = Math.atan2(ht.y-b.y, ht.x-b.x);
        var cur = Math.atan2(b.vy, b.vx);
        var diff = want - cur;
        while(diff > Math.PI) diff -= TAU;
        while(diff < -Math.PI) diff += TAU;
        var na = cur + clamp(diff, -b.homing*dt, b.homing*dt);
        var spd = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na)*spd;
        b.vy = Math.sin(na)*spd;
      }
    }

    b.x += b.vx*dt;
    b.y += b.vy*dt;

    for(var k2=0; k2<enemies.length; k2++){
      var en = enemies[k2];
      if(en.dead) continue;
      if(b.hit.indexOf(en) !== -1) continue;
      var rsum = b.r + en.r;
      if(dist2(b.x, b.y, en.x, en.y) < rsum*rsum){
        b.hit.push(en);
        var crit = Math.random() < player.crit;
        var dm = crit ? b.dmg*player.critMul : b.dmg;
        if(b.explode){
          explode(b.x, b.y, b.explode, b.dmg*0.75);
          damageEnemy(en, dm, b.x, b.y, crit);
          b.dead = true;
        } else {
          damageEnemy(en, dm, b.x, b.y, crit);
          if(b.pierce > 0) b.pierce--;
          else b.dead = true;
        }
        break;
      }
    }
    if(b.life <= 0) b.dead = true;
  }
  bullets = bullets.filter(function(x){ return !x.dead; });

  // --- пули врагов ---
  for(var bj=ebullets.length-1; bj>=0; bj--){
    var eb = ebullets[bj];
    eb.x += eb.vx*dt;
    eb.y += eb.vy*dt;
    eb.life -= dt;
    var rs2 = eb.r + player.r;
    if(dist2(eb.x, eb.y, player.x, player.y) < rs2*rs2){
      hurtPlayer(eb.dmg);
      ebullets.splice(bj,1);
      continue;
    }
    if(eb.life <= 0) ebullets.splice(bj,1);
  }

  // --- сферы опыта ---
  for(var oi=orbs.length-1; oi>=0; oi--){
    var o = orbs[oi];
    o.t += dt*3;
    var odx = player.x - o.x, ody = player.y - o.y;
    var od = Math.hypot(odx, ody) || 1;
    if(od < player.magnetR){
      var pull = 340 + (player.magnetR - od) * 3.5;
      o.x += (odx/od) * pull * dt;
      o.y += (ody/od) * pull * dt;
    }
    if(od < player.r + 10){
      gainXp(o.v);
      orbs.splice(oi,1);
    }
  }

  // --- кольца: суперудар и взрывы ---
  for(var ri=rings.length-1; ri>=0; ri--){
    var rg = rings[ri];
    rg.r += rg.speed * dt;
    for(var ek=0; ek<enemies.length; ek++){
      var ee = enemies[ek];
      if(ee.dead) continue;
      if(rg.hits.indexOf(ee) !== -1) continue;
      var dr = Math.hypot(ee.x-rg.x, ee.y-rg.y);
      if(dr < rg.r + ee.r){
        rg.hits.push(ee);
        damageEnemy(ee, rg.dmg, ee.x, ee.y, true);
        var ar = Math.atan2(ee.y-rg.y, ee.x-rg.x);
        ee.kx = Math.cos(ar) * 560;
        ee.ky = Math.sin(ar) * 560;
      }
    }
    if(rg.r > rg.maxR) rings.splice(ri,1);
  }

  // --- молнии ---
  for(var bl=bolts.length-1; bl>=0; bl--){
    bolts[bl].life -= dt;
    if(bolts[bl].life <= 0) bolts.splice(bl,1);
  }

  // --- ящики с оружием ---
  for(var pi=pickups.length-1; pi>=0; pi--){
    var pk = pickups[pi];
    pk.t += dt;
    var pd = Math.hypot(player.x-pk.x, player.y-pk.y);
    if(pd < player.r + pk.r + 6){
      pickups.splice(pi,1);
      openWeaponChoice();
      break;
    }
  }

  updateParticles(dt);
  updateTexts(dt);
}

function hurtPlayer(amount){
  if(player.invuln > 0) return;
  player.hp -= amount;
  player.invuln = 0.55;
  shake = Math.max(shake, 13);
  spawnParticles(player.x, player.y, 14, '#ff6b8a', 240, 4, 0.5);
  if(player.hp <= 0){
    player.hp = 0;
    die();
  }
}

function die(){
  state = 'dead';
  shake = 34;
  spawnParticles(player.x, player.y, 120, '#8ef7ff', 700, 7, 1.4);
  saveBest();
}

// ============================================================
//  ГЛАВНЫЙ ЦИКЛ
// ============================================================
function update(raw){
  clock += raw;
  updateStars(raw);

  if(hitStop > 0) hitStop -= raw;
  var targetScale = (hitStop > 0) ? 0.35 : 1;
  timeScale += (targetScale - timeScale) * Math.min(1, raw*14);

  var dt = raw * timeScale;

  if(state === 'playing'){
    updateWorld(dt);
  } else if(state === 'dead'){
    updateParticles(raw*0.4);
    updateTexts(raw*0.4);
  }

  shake *= Math.pow(0.03, raw);
  if(shake < 0.25) shake = 0;
}

var last = performance.now();
function loop(now){
  var raw = (now - last) / 1000;
  last = now;
  if(raw > 0.05) raw = 0.05;
  update(raw);
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
//  ОТРИСОВКА МИРА
// ============================================================
function drawWorld(){
  var i;

  for(i=0;i<rings.length;i++){
    var rg = rings[i];
    var a = clamp(1 - rg.r / rg.maxR, 0, 1);
    ctx.strokeStyle = hexA(rg.color, a*0.9);
    ctx.lineWidth = rg.width * (0.35 + a*0.9);
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = hexA('#ffffff', a*0.35);
    ctx.lineWidth = Math.max(1, rg.width*0.25);
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r*0.93, 0, TAU); ctx.stroke();
  }

  for(i=0;i<orbs.length;i++){
    var o = orbs[i];
    var pr = o.r + Math.sin(o.t)*0.8;
    ctx.fillStyle = 'rgba(90,220,255,0.18)';
    ctx.beginPath(); ctx.arc(o.x, o.y, pr*3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5ad9ff';
    ctx.beginPath(); ctx.arc(o.x, o.y, pr, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(o.x - pr*0.3, o.y - pr*0.3, pr*0.4, 0, TAU); ctx.fill();
  }

  for(i=0;i<pickups.length;i++) drawPickup(pickups[i]);

  for(i=0;i<enemies.length;i++){
    if(enemies[i].isBoss) drawBoss(enemies[i]);
    else drawEnemy(enemies[i]);
  }

  if(player) drawPlayer();

  ctx.globalCompositeOperation = 'lighter';
  for(i=0;i<bullets.length;i++){
    var b = bullets[i];
    ctx.fillStyle = hexA(b.color, 0.25);
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.45, 0, TAU); ctx.fill();
  }

  for(i=0;i<ebullets.length;i++){
    var ebul = ebullets[i];
    ctx.fillStyle = hexA(ebul.color, 0.3);
    ctx.beginPath(); ctx.arc(ebul.x, ebul.y, ebul.r*2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = ebul.color;
    ctx.beginPath(); ctx.arc(ebul.x, ebul.y, ebul.r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  for(i=0;i<bolts.length;i++){
    var bo = bolts[i];
    var la = clamp(bo.life / bo.max, 0, 1);
    ctx.strokeStyle = 'rgba(190,225,255,' + (0.9*la) + ')';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    for(var p=0;p<bo.pts.length;p++){
      if(p===0) ctx.moveTo(bo.pts[p][0], bo.pts[p][1]);
      else ctx.lineTo(bo.pts[p][0], bo.pts[p][1]);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.8*la) + ')';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'lighter';
  for(i=0;i<parts.length;i++){
    var pt = parts[i];
    var pa = clamp(pt.life / pt.max, 0, 1);
    ctx.fillStyle = hexA(pt.color, pa*0.85);
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r*pa, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  for(i=0;i<texts.length;i++){
    var tx = texts[i];
    var ta = clamp(tx.life / tx.max, 0, 1);
    ctx.font = 'bold ' + tx.size + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = hexA(tx.color, ta);
    ctx.fillText(tx.text, tx.x, tx.y);
  }
}

function drawEnemy(e){
  var pulse = 1 + Math.sin(e.seed + time*6)*0.07;
  var r = e.r * pulse;

  ctx.fillStyle = hexA(e.color, 0.14);
  ctx.beginPath(); ctx.arc(e.x, e.y, r*2.1, 0, TAU); ctx.fill();

  var body = e.hitFlash > 0 ? '#ffffff' : e.color;

  if(e.type === 'runner'){
    var ang = Math.atan2(player.y - e.y, player.x - e.x);
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(r*1.35, 0);
    ctx.lineTo(-r*0.9, r*0.85);
    ctx.lineTo(-r*0.45, 0);
    ctx.lineTo(-r*0.9, -r*0.85);
    ctx.closePath();
    ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  } else if(e.type === 'brute'){
    ctx.fillStyle = body;
    poly(e.x, e.y, r, 6, time*0.4 + e.seed);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    poly(e.x, e.y, r*0.45, 6, -time*0.6 + e.seed);
    ctx.fill();
  } else {
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(e.x - r*0.3, e.y - r*0.32, r*0.28, 0, TAU); ctx.fill();
  }
}

function drawBoss(b){
  var r = b.r;
  var glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r*3);
  glow.addColorStop(0, 'rgba(255,94,168,0.34)');
  glow.addColorStop(1, 'rgba(255,94,168,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(b.x, b.y, r*3, 0, TAU); ctx.fill();

  var col = b.hitFlash > 0 ? '#ffffff' : b.color;

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.spin);
  ctx.strokeStyle = hexA(col, 0.7);
  ctx.lineWidth = 3;
  for(var i=0;i<6;i++){
    var a0 = i*(TAU/6);
    ctx.beginPath();
    ctx.arc(0, 0, r*1.42, a0, a0 + 0.55);
    ctx.stroke();
  }
  ctx.restore();

  poly(b.x, b.y, r, 6, b.spin*0.5);
  ctx.fillStyle = 'rgba(40,10,30,0.92)';
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = col;
  ctx.stroke();

  var core = r*0.5 + Math.sin(clock*5)*3;
  var cg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, core*1.6);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.45, col);
  cg.addColorStop(1, hexA(col, 0));
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(b.x, b.y, core*1.6, 0, TAU); ctx.fill();
}

function drawPickup(p){
  var pulse = 1 + Math.sin(p.t*5)*0.1;
  ctx.save();
  ctx.translate(p.x, p.y);

  ctx.fillStyle = 'rgba(255,224,102,0.16)';
  ctx.beginPath(); ctx.arc(0, 0, p.r*2.4, 0, TAU); ctx.fill();

  ctx.rotate(p.t*1.4);
  rr(-20*pulse, -20*pulse, 40*pulse, 40*pulse, 9);
  ctx.fillStyle = 'rgba(46,38,12,0.95)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#ffe066';
  ctx.stroke();
  ctx.rotate(-p.t*1.4);

  ctx.fillStyle = '#ffe066';
  ctx.font = 'bold 22px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('\u2605', 0, 1);
  ctx.restore();
}

function drawPlayer(){
  var p = player;

  var ag = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*3.4);
  ag.addColorStop(0, 'rgba(120,240,255,0.32)');
  ag.addColorStop(1, 'rgba(120,240,255,0)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r*3.4, 0, TAU); ctx.fill();

  if(superCd <= 0){
    var prr = p.r + 13 + Math.sin(clock*4)*3;
    ctx.strokeStyle = 'rgba(181,139,255,' + (0.5 + 0.4*Math.sin(clock*4)) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, prr, 0, TAU); ctx.stroke();
  }

  var blink = p.invuln > 0 && Math.floor(clock*20)%2 === 0;
  ctx.globalAlpha = blink ? 0.4 : 1;

  var g = ctx.createRadialGradient(p.x - p.r*0.3, p.y - p.r*0.35, 1, p.x, p.y, p.r*1.5);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.4, '#8ef7ff');
  g.addColorStop(1, '#1b6fff');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.stroke();
  ctx.globalAlpha = 1;

  var dp = dronePositions();
  for(var i=0;i<dp.length;i++){
    ctx.save();
    ctx.translate(dp[i][0], dp[i][1]);
    ctx.rotate(clock*3);
    rr(-6, -6, 12, 12, 3);
    ctx.fillStyle = '#c9a8ff';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

// ============================================================
//  HUD
// ============================================================
function drawHUD(){
  var pad = 18;
  var i;

  // полоса опыта
  var xpW = W - pad*2;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(pad, 10, xpW, 6);
  var xp = clamp(player.xp / player.xpNext, 0, 1);
  if(xp > 0){
    var gx = ctx.createLinearGradient(pad, 0, pad+xpW, 0);
    gx.addColorStop(0, '#5df2ff');
    gx.addColorStop(1, '#b58bff');
    ctx.fillStyle = gx;
    ctx.fillRect(pad, 10, xpW*xp, 6);
  }

  // HP
  var hx = pad, hy = 28, hw = 230, hh = 18;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  rr(hx, hy, hw, hh, 9); ctx.fill();
  var hp = clamp(player.hp / player.maxhp, 0, 1);
  if(hp > 0.01){
    var hg = ctx.createLinearGradient(hx, 0, hx+hw, 0);
    if(hp > 0.35){ hg.addColorStop(0, '#37f08a'); hg.addColorStop(1, '#9dffcf'); }
    else { hg.addColorStop(0, '#ff4d6d'); hg.addColorStop(1, '#ff8fa3'); }
    ctx.fillStyle = hg;
    rr(hx, hy, hw*hp, hh, 9); ctx.fill();
  }
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px ' + FONT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.max(0, Math.ceil(player.hp)) + ' / ' + player.maxhp, hx + 10, hy + hh/2 + 1);

  // время
  ctx.textAlign = 'center';
  ctx.fillStyle = '#EDEFF3';
  ctx.font = 'bold 26px ' + FONT;
  ctx.fillText(fmtTime(time), W/2, 40);

  // убийства и уровень
  ctx.textAlign = 'right';
  ctx.font = 'bold 14px ' + FONT;
  ctx.fillStyle = 'rgba(237,239,243,0.75)';
  ctx.fillText('Убито: ' + killCount, W - pad, 34);
  ctx.fillText('Уровень: ' + player.lvl, W - pad, 54);

  // полоса мини-босса
  if(boss && !boss.dead){
    var bw = Math.min(560, W*0.6);
    var bx = W/2 - bw/2, by = 70, bh = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    rr(bx, by, bw, bh, 8); ctx.fill();
    var bp = clamp(boss.hp / boss.maxhp, 0, 1);
    if(bp > 0.01){
      var bg = ctx.createLinearGradient(bx, 0, bx+bw, 0);
      bg.addColorStop(0, '#ff5ea8');
      bg.addColorStop(1, '#ffb0d4');
      ctx.fillStyle = bg;
      rr(bx, by, bw*bp, bh, 8); ctx.fill();
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.font = 'bold 12px ' + FONT;
    ctx.fillStyle = 'rgba(255,176,212,0.95)';
    ctx.fillText('МИНИ-БОСС ' + boss.tier, W/2, by - 4);
  }

  // суперудар
  var sw = 320, shh = 14, sx = W/2 - sw/2, sy = H - 44;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  rr(sx, sy, sw, shh, 7); ctx.fill();
  var ready = superCd <= 0;
  var sp = ready ? 1 : (1 - superCd/SUPER_CD);
  if(sp > 0.01){
    var sg = ctx.createLinearGradient(sx, 0, sx+sw, 0);
    sg.addColorStop(0, '#7a4bff');
    sg.addColorStop(1, '#d9c2ff');
    ctx.fillStyle = sg;
    ctx.globalAlpha = ready ? (0.75 + 0.25*Math.sin(clock*7)) : 1;
    rr(sx, sy, sw*sp, shh, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.font = 'bold 12px ' + FONT;
  ctx.fillStyle = ready ? '#d9c2ff' : 'rgba(237,239,243,0.6)';
  ctx.fillText(ready ? 'ПРОБЕЛ — СУПЕРУДАР ГОТОВ' : 'СУПЕРУДАР: ' + Math.ceil(superCd) + ' с', W/2, sy - 8);

  // подсказка паузы
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.font = 'bold 11px ' + FONT;
  ctx.fillStyle = 'rgba(237,239,243,0.3)';
  ctx.fillText('ESC — пауза', W - pad, H - 12);

  // иконки оружия
  var ix = pad, iy = H - 80;
  for(i=0;i<player.weapons.length;i++){
    var wdef = WEAPON_BY_ID[player.weapons[i].id];
    if(!wdef) continue;
    ctx.fillStyle = hexA(wdef.color, 0.18);
    rr(ix, iy, 34, 34, 9); ctx.fill();
    ctx.strokeStyle = hexA(wdef.color, 0.8);
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = wdef.color;
    ctx.font = 'bold 13px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(wdef.name.charAt(0), ix + 17, iy + 18);
    ix += 40;
  }
}

// ============================================================
//  ЭКРАНЫ
// ============================================================
function drawCardRow(items, hint){
  var cw = Math.min(270, (W - 120)/3);
  var ch = 190;
  var gap = 24;
  var tot = cw*3 + gap*2;
  var x0 = W/2 - tot/2;
  var y0 = H/2 - ch/2 + 10;

  for(var i=0;i<items.length;i++){
    var it = items[i];
    var x = x0 + i*(cw + gap);

    rr(x, y0, cw, ch, 18);
    ctx.fillStyle = 'rgba(16,20,34,0.96)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = it.color;
    ctx.stroke();

    ctx.save();
    rr(x, y0, cw, ch, 18);
    ctx.clip();
    var g = ctx.createLinearGradient(x, y0, x, y0 + 70);
    g.addColorStop(0, hexA(it.color, 0.22));
    g.addColorStop(1, hexA(it.color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x, y0, cw, 70);
    ctx.restore();

    rr(x + 14, y0 + 14, 28, 28, 8);
    ctx.fillStyle = hexA(it.color, 0.92);
    ctx.fill();
    ctx.fillStyle = '#080a14';
    ctx.font = 'bold 15px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i+1), x + 28, y0 + 29);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#EDEFF3';
    ctx.font = 'bold 17px ' + FONT;
    var nameLines = wrapText(it.title, cw - 32, 'bold 17px ' + FONT);
    var ty = y0 + 56;
    for(var n=0; n<nameLines.length && n<2; n++){
      ctx.fillText(nameLines[n], x + cw/2, ty);
      ty += 21;
    }

    ctx.fillStyle = 'rgba(237,239,243,0.68)';
    ctx.font = '13px ' + FONT;
    var dLines = wrapText(it.desc, cw - 34, '13px ' + FONT);
    ty = y0 + 106;
    for(var d=0; d<dLines.length && d<4; d++){
      ctx.fillText(dLines[d], x + cw/2, ty);
      ty += 17;
    }
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(237,239,243,0.55)';
  ctx.font = 'bold 13px ' + FONT;
  ctx.fillText(hint, W/2, y0 + ch + 44);
}

function drawCards(title, items, hint){
  ctx.fillStyle = 'rgba(4,6,16,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#EDEFF3';
  ctx.font = 'bold 30px ' + FONT;
  ctx.fillText(title, W/2, H/2 - 160);
  drawCardRow(items, hint);
}

function drawMenu(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  var g = ctx.createLinearGradient(0, H/2 - 160, 0, H/2 - 40);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.55, '#8ef7ff');
  g.addColorStop(1, '#b58bff');
  ctx.fillStyle = g;
  ctx.font = 'bold 62px ' + FONT;
  ctx.fillText('НЕОН', W/2, H/2 - 100);
  ctx.fillText('ВЫЖИВАНИЕ', W/2, H/2 - 32);

  ctx.fillStyle = 'rgba(237,239,243,0.72)';
  ctx.font = 'bold 15px ' + FONT;
  ctx.fillText('WASD / стрелки — движение   •   стрельба сама', W/2, H/2 + 20);
  ctx.fillText('ПРОБЕЛ — суперудар (перезарядка 30 с)', W/2, H/2 + 46);
  ctx.fillText('ESC — пауза', W/2, H/2 + 72);

  ctx.fillStyle = 'rgba(255,224,102,0.85)';
  ctx.font = 'bold 14px ' + FONT;
  ctx.fillText('Каждые ~55 секунд приходит мини-босс. Убей его — и забери оружие.', W/2, H/2 + 112);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px ' + FONT;
  ctx.fillText('Enter — начать', W/2, H/2 + 168);

  ctx.fillStyle = 'rgba(237,239,243,0.5)';
  ctx.font = 'bold 13px ' + FONT;
  ctx.fillText('Лучшее время: ' + fmtTime(best), W/2, H/2 + 202);
}

function drawPause(){
  ctx.fillStyle = 'rgba(4,6,16,0.72)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 48px ' + FONT;
  ctx.fillText('ПАУЗА', W/2, H/2 - 90);

  ctx.fillStyle = 'rgba(237,239,243,0.85)';
  ctx.font = 'bold 16px ' + FONT;
  ctx.fillText('Время: ' + fmtTime(time) + '    Убито: ' + killCount + '    Уровень: ' + player.lvl, W/2, H/2 - 40);

  ctx.fillStyle = 'rgba(237,239,243,0.55)';
  ctx.font = 'bold 13px ' + FONT;
  var wnames = [];
  for(var i=0;i<player.weapons.length;i++){
    var wd = WEAPON_BY_ID[player.weapons[i].id];
    if(wd) wnames.push(wd.name);
  }
  ctx.fillText(wnames.length ? 'Оружие: ' + wnames.join(' • ') : 'Оружие: базовый бластер', W/2, H/2 - 8);

  var sup = superCd <= 0 ? 'готов' : Math.ceil(superCd) + ' с';
  ctx.fillText('Суперудар: ' + sup + '    HP: ' + Math.ceil(player.hp) + '/' + player.maxhp, W/2, H/2 + 16);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px ' + FONT;
  ctx.fillText('ESC / P — продолжить      •      R — заново', W/2, H/2 + 76);
}

function drawDead(){
  ctx.fillStyle = 'rgba(20,2,10,0.74)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ff6b8a';
  ctx.font = 'bold 52px ' + FONT;
  ctx.fillText('ТЫ ПАЛ', W/2, H/2 - 90);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px ' + FONT;
  ctx.fillText('Продержался ' + fmtTime(time), W/2, H/2 - 40);

  ctx.fillStyle = 'rgba(237,239,243,0.8)';
  ctx.font = 'bold 16px ' + FONT;
  ctx.fillText('Убито: ' + killCount + '    Уровень: ' + player.lvl, W/2, H/2 - 6);

  var isBest = time >= best - 0.001;
  ctx.fillStyle = isBest ? '#ffe066' : 'rgba(237,239,243,0.55)';
  ctx.font = 'bold 14px ' + FONT;
  ctx.fillText(isBest ? 'НОВЫЙ РЕКОРД!' : 'Лучшее время: ' + fmtTime(best), W/2, H/2 + 26);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px ' + FONT;
  ctx.fillText('R / Enter — заново', W/2, H/2 + 84);
}

// ============================================================
//  ОБЩАЯ ОТРИСОВКА
// ============================================================
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if(shake > 0.5) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  drawBackground();

  if(state !== 'menu' && player){
    ctx.save();
    ctx.translate(W/2 - cam.x, H/2 - cam.y);
    drawWorld();
    ctx.restore();

    drawVignette();
    drawHUD();
  } else {
    drawVignette();
  }

  ctx.restore();

  if(state === 'menu') drawMenu();
  else if(state === 'paused') drawPause();
  else if(state === 'dead') drawDead();
  else if(state === 'upgrade' && upgradeChoices){
    var up = [];
    for(var i=0;i<upgradeChoices.length;i++){
      up.push({ title:upgradeChoices[i].name, desc:upgradeChoices[i].desc, color:upgradeChoices[i].color });
    }
    drawCards('УРОВЕНЬ ' + player.lvl + ' — выбери улучшение', up, '1 / 2 / 3 — выбрать');
  }
  else if(state === 'weapon' && weaponChoices){
    var wl = [];
    for(var j=0;j<weaponChoices.length;j++){
      wl.push({ title:weaponChoices[j].name, desc:weaponChoices[j].desc, color:weaponChoices[j].color });
    }
    drawCards('ОРУЖИЕ С МИНИ-БОССА', wl, '1 / 2 / 3 — забрать оружие');
  }
}

// ============================================================
//  СТАРТ
// ============================================================
resize();
requestAnimationFrame(loop);

})();
</script>
